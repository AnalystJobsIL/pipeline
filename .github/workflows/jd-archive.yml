name: JD archive backfill (cloud)

# Fetches a job description for the cards the TITLE gate drops — the corpus, not the board.
# `enrich_scrape_jd.py`'s title pool still runs inside the digest at 05:00; this walks
# everything else in `scraped_cache.json` on its own clock, because that pool is ~1,200 cards
# and the digest's step has 30 minutes on the mail's critical path.
#
# WHY IT IS SAFE TO RUN LONG: `concurrency: repo-state` puts this job in the queue with every
# other state-writing workflow, including `scrape-refresh.yml`, which writes the SAME file. So
# it cannot race that one, and it cannot delay the mail, because `daily-digest.yml` is alone in
# its own group.
#
# THAT LAST PROPERTY CUTS BOTH WAYS, and it is why the cron is at midday. Being in a different
# group from the digest means nothing serialises us AGAINST it either — and the digest is the
# third writer of `scraped_cache.json`. `persist_state` merges that file per COMPANY KEY,
# ours-changed-wins, so two runs that both touched a company do not merge: one wins whole. This
# pass touches nearly every company. See the schedule comment below.
#
# GitHub dispatches these crons when it feels like it (scrape-refresh is scheduled 00:00 and
# started 04:44, 07:49, 05:41, 00:39, 00:38 on its last five real runs; retry-unreachable is
# scheduled 02:30 and started 09:14 on 2026-08-29), so this pass assumes NOTHING about running
# before the digest or about yesterday's run having finished: it is idempotent within a day (a
# filled card carries a description and is skipped) and resumable across days (cards are walked
# oldest-attempt-first, so today starts where yesterday stopped and never re-walks the prefix).
#
# The enrich pass is NOT `continue-on-error` -- most of this repo's named steps are, and that
# is why four days of zero yield went unseen. If the pass fails, this workflow is red. The
# archive step above it IS (2026-09-04), by design: it must never take the pass down, and
# its failure is not silent -- it is the `wayback` stamp's alarm in the morning mail.

on:
  schedule:
    # 12:30, NOT 01:30, and the reason is `scraped_cache.json`, not politeness. Three workflows
    # write that file and `persist_state` merges it PER COMPANY KEY, ours-changed-wins -- so two
    # runs that both touched a company do not merge, one of them wins whole. This pass stamps
    # nearly every company every night, and `daily-digest.yml` (05:00, its own concurrency
    # group, so no queue serialises us against it) collects that day new roles into the same
    # file. Starting at 01:30 with a 90-minute budget and a 170-minute timeout put this job in
    # flight across the digest hour on any of the mornings GitHub dispatches late -- and it
    # dispatches late constantly (00:00 -> 04:44, 07:49, 05:41 on scrape-refresh five last
    # runs). Midday is the far side of the day from the 05:00-08:30 digest-and-relay window.
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    # A circuit breaker, not the budget. The BUDGET is JD_ENRICH_TIME_BUDGET_MIN below, and it
    # is deliberately smaller: `repo-state` already carries scrape-refresh (78 min observed),
    # retry-unreachable (50), auto-expand twice daily, firmographics, listing-hunt, triage-dark
    # and a 330-minute Sunday audit, all queued behind each other. Reserving 150 minutes of a
    # serialised group on an ESTIMATE is how a queue starves.
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Decide whether this run may buy Bright Data credits
        # The ONE place that knows the monthly ceiling reads the LIVE account
        # (`pipeline/bd_budget.py`): unlimited through August 2026, 5,000 from 2026-09-01. This
        # job carries a 1,000-credit circuit breaker, a fifth of that ceiling, so it is the
        # last workflow that should be taking the ceiling on trust. Fails OPEN by design (an
        # unreadable balance spends) -- the count cap below is the bound that needs no network.
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          CAP=1000
          if ! python -m pipeline.bd_budget; then
            echo "paid rungs OFF: the monthly ceiling is reached"; CAP=0
          fi
          echo "JD_ENRICH_BD_CAP=$CAP" >> "$GITHUB_ENV"
          echo "- Bright Data cap this run: **$CAP**" >> "$GITHUB_STEP_SUMMARY"

      - name: Submit every posting we have seen to the Internet Archive
        # `archive_evidence.py` (infra, 2026-09-04): a third-party snapshot behind every
        # posting before a dispute needs one -- Taboola's vanished nine days after we last
        # saw it and no cache held its text. FIRST, before the 90-minute enrich pass, so an
        # overrun there cannot starve it. Anonymous, one request every 6 s (the archive
        # allows 15 a minute per IP and blocks for five minutes past that), 100 postings +
        # 25 careers pages a day, 140 requests all told. The 302 naming a capture arrives
        # after 18 s or after minutes (measured 09-04), so three threads wait behind one 6 s
        # pace gate, and a 60 s timeout is `pending` -- the capture very probably exists and
        # the next run asks the archive. It never raises: a refusal is a
        # ledger line with a cooldown, a throttle ends the day, and `continue-on-error`
        # keeps a crash from taking the enrich pass with it -- the crash is still a
        # `wayback crashed:` clause in the morning mail's `Stages:` line, so it is not
        # silent. What it produced is the `[wayback] submitted N` line below and the same
        # numbers in the `wayback` stamp.
        env:
          WAYBACK_DAY_CAP: "150"
          WAYBACK_BOARD_CAP: "25"
          WAYBACK_REQ_CAP: "140"
          WAYBACK_TIME_BUDGET_MIN: "30"
          WAYBACK_PACE_S: "6"
          WAYBACK_TIMEOUT_S: "60"
          WAYBACK_WORKERS: "3"
        timeout-minutes: 40
        run: python archive_evidence.py
        continue-on-error: true

      - name: Fetch descriptions for the cards the title gate drops
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # 90 minutes for the first week, then raise it on the MEASURED number the run
          # prints (`U min used`, and `scrape_archive_cycle_days` in the stamp). A budget
          # nobody has measured that silently truncates is the same defect as a binding cap.
          JD_ENRICH_TIME_BUDGET_MIN: "90"
          # JD_ENRICH_BD_CAP comes from the budget step above. A runaway backstop; `bd-capped`
          # is an ALARM when it bites, never a clean stop.
          JD_ENRICH_CAP: "4000"
        run: python enrich_scrape_jd.py --archive-only

      - name: What this run produced
        # CLAUDE.md rule 1: say what it PRODUCED, where a human sees it. The same numbers reach
        # the morning mail through the `enrich` stamp, so a night of zero fills is visible
        # without anyone opening a run log — which is how 08-27, 08-28 and 08-29 went unnoticed.
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          try:
              e = json.load(open("cloud_state/pipeline_stages.json", encoding="utf-8"))["enrich"]
          except Exception as exc:
              print(f"- enrich stamp unreadable: {exc}")
          else:
              print(f"- archive: **{e.get('scrape_archive_filled', 0)} filled** of "
                    f"{e.get('scrape_archive_todo', '?')} due, "
                    f"{e.get('scrape_archive_left', 0)} left for tomorrow, "
                    f"one lap {e.get('scrape_archive_cycle_days', '?')} days, "
                    f"{e.get('scrape_archive_minutes', '?')} min used")
              print(f"- still thin: **{e.get('scrape_thin_remaining', '?')} cards** "
                    f"(the denominator tomorrow's fill is read against)")
              calls, shell = e.get("scrape_bd_calls", 0), e.get("scrape_bd_shell", 0)
              print(f"- Bright Data: {calls} calls ({e.get('scrape_bd_rendered', 0)} rendered), "
                    f"{shell} bodies with no posting in them, {e.get('scrape_archive_bd', 0)} filled"
                    if calls else "- Bright Data: 0 calls")
              if e.get("alarm"):
                  print(f"- **alarm:** {e['alarm']}")
          PY
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error, and the same policy every other workflow follows
        # (ARCHITECTURE §4): a broken registry makes the job red here, and persist_state.py
        # below still lands every path this job owns.
        run: python check_invariants.py

      - name: Commit the enriched cache
        # One delivery path for every workflow (persist_state.py, lane: infra). `if: always()`
        # so a timeout or a failed step does not discard the night's fetches — the driver also
        # checkpoints the cache every 100 saves, because a runner SIGTERM runs no `finally`.
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "jd-bot" \
            -m "jd archive: descriptions for the cards the title gate drops $(date -u +%F) [skip ci]" \
            --own scraped_cache.json cloud_state/pipeline_stages.json cloud_state/wayback_ledger.jsonl
