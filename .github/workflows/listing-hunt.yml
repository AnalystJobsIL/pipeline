name: Listing-hunt dark companies (find + verify real listings pages)

# For every company marked 'no ATS detected' or 'unsupported ATS': find its real job-LISTINGS
# URL (harvested links + Claude's pick), then verify by running the 4-strategy scraper on it
# (XHR capture / DOM cards / heading-groups / position-links). Activates only rows that yield
# >=1 verified Israel job; persists a listing-hunt verdict either way. Time-budgeted; re-run
# to continue with the remainder.

on:
  schedule:
    - cron: "0 19 * * *"   # after triage(18:00), finishes before the 00:00 refresh       # daily; no-ops in minutes once every company has a verdict
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to process (0 = all remaining)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: |
          cp companies.csv /tmp/base.csv || true
          cp scraped_cache.json /tmp/base_cache.json || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI + Playwright
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      # extract-gap = triage confirmed roles ARE on the stored URL and our extractor missed
      # them. No search needed, so this is the cheapest dark-row mode to repair — and running
      # it FIRST removes those rows from the hunt's pool below.
      # A hostname with no DNS record cannot be rendered, unlocked or cracked — there is
      # nothing there. It can only be fixed by SEARCHING for the real careers page, so this
      # must run BEFORE the hunt or the hunt spends its budget on addresses that don't exist.
      - name: Repair rows whose stored hostname does not resolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REPAIR_URL_TIME_BUDGET_MIN: "30"
        run: python repair_dead_urls.py --apply
        continue-on-error: true

      - name: Repair extract-gap rows (re-scrape known URLs with the LLM tier forced)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REPAIR_TIME_BUDGET_MIN: "35"
          SCRAPE_LLM: "1"
          SCRAPE_VIA_UNLOCKER: "1"   # these pages 429/403 a datacenter IP; residential wins
        run: python repair_extract_gap.py --apply
        continue-on-error: true

      - name: Hunt listings
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the hunt had NO Bright Data credentials, so google_via_unlocker — its only
          # fallback when DuckDuckGo returns nothing — could never run in the cloud
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          HUNT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          HUNT_TIME_BUDGET_MIN: "200"   # leaves ~90 min for the re-crack step + commit
          FAST_SCRAPE: "1"
          SCRAPE_LLM: "1"
          SCRAPE_VIA_UNLOCKER: "1"
        run: python listing_hunt.py --apply
        continue-on-error: true
      - name: Re-crack walled-ATS rows (daily; hosts already documented)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPE_LLM: "1"
          SCRAPE_VIA_UNLOCKER: "1"
          CRACK_LIMIT: "400"            # 61 companies sit on walled ATSes; 25 never cleared it
          CRACK_TIME_BUDGET_MIN: "60"
        run: python crack_walled.py --apply || echo "re-crack skipped"
        continue-on-error: true


      # Record that this stage finished, and how much it did. pipeline/stages.py turns the
      # implicit cron ordering into something the next stage can actually READ: the digest
      # warns in its audit block when its prerequisites did not run today, instead of
      # silently building on yesterday's URLs.
      - name: Record the resolution-ladder state (this is the one job with Playwright + Bright Data)
        # rung lines only, to cloud_state/registry_ladder.json; alarms_state re-emits them in
        # the daily mail and reports this file's date when it goes stale. live=False: no spend.
        # The keys MUST be on this step: a step without them records "Bright Data DOWN" as a
        # fact and the mail repeats it daily forever (confirmation-wave R3, B1).
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python registry_health.py --ladder || echo "ladder probe skipped"
        continue-on-error: true
      - name: Stamp the 'repair' stage
        if: always()
        run: python -m pipeline.stages stamp repair
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a run that broke an invariant
        # loses its work rather than committing it -- docs/BACKLOG.md 64.
        run: python check_invariants.py
      - name: Commit verdicts
        run: |
          git config user.name  "audit-bot"
          git config user.email "audit@users.noreply.github.com"
          git add companies.csv scraped_cache.json cloud_state/pipeline_stages.json
          # the ladder file is OPTIONAL output of a continue-on-error step: a missing pathspec
          # would abort this whole `git add` under bash -e and discard the night's registry
          # writes (confirmation-wave R1, B4) -- add it separately, tolerantly
          git add cloud_state/registry_ladder.json 2>/dev/null || echo "no ladder file this run"
          git commit -m "listing-hunt $(date -u +%F) [skip ci]" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              # CONFLICT on companies.csv: rebase can't merge it, and giving up here
              # discards the whole run (3.5h listing-hunt lost 2026-08-22). Re-apply just
              # THIS run's row changes onto origin's current file and retry.
              git rebase --abort 2>/dev/null || true
              # preserve EVERY artifact this run produced — `git reset --hard` below would
              # otherwise destroy seen.db (re-emailing every role), caches and digests.
              rm -rf /tmp/ours && mkdir -p /tmp/ours
              for p in companies.csv scraped_cache.json discovered_cache.json                        research_companies.json cloud_state digests docs; do
                [ -e "$p" ] && cp -r "$p" /tmp/ours/ 2>/dev/null || true
              done
              git fetch origin ${GITHUB_REF_NAME} || true
              git reset --hard origin/${GITHUB_REF_NAME} || true
              # Copy back ONLY what THIS job owns. `cp -r cloud_state .` restored the whole
              # directory as it was at CHECKOUT TIME, so a run that conflicts hours later
              # silently reverted every cloud_state/seen.db row other workflows had committed
              # in between — sent/matched/llm_cache/firmographics, last-writer-wins on a
              # binary git cannot merge (HANDOFF open item 7). Only the digest owns seen.db.
              for p in cloud_state/pipeline_stages.json; do
                [ -e "/tmp/ours/$p" ] && { mkdir -p "$(dirname "$p")"; cp -r "/tmp/ours/$p" "$p"; } 2>/dev/null || true
              done
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours/companies.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours/companies.csv companies.csv || true
                # the merged registry passes the same gate before it is committed
                python check_invariants.py || { echo "::error::merged registry fails invariants"; exit 1; }
              fi
              # scraped_cache.json has eight writers across six workflows, each rewriting the
              # whole dict — restoring ours wholesale deleted every company another workflow
              # had cached since checkout. Merge it per company key, like the csv.
              if [ -f /tmp/base_cache.json ] && [ -f /tmp/ours/scraped_cache.json ]; then
                python merge_json_cache.py /tmp/base_cache.json /tmp/ours/scraped_cache.json                        scraped_cache.json scraped_cache.json || true
              fi
              git add -A . || true
              git commit -m "row-merged state $(date -u +%F) [skip ci]" || true
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1
