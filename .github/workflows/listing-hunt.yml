name: Listing-hunt dark companies (find + verify real listings pages)

# For every company marked 'no ATS detected' or 'unsupported ATS': find its real job-LISTINGS
# URL (harvested links + Claude's pick), then verify by running the 4-strategy scraper on it
# (XHR capture / DOM cards / heading-groups / position-links). Activates only rows that yield
# >=1 verified Israel job; persists a listing-hunt verdict either way. Time-budgeted; re-run
# to continue with the remainder.

on:
  schedule:
    - cron: "0 19 * * *"   # after triage(18:00), finishes before the 00:00 refresh       # daily; no-ops in minutes once every company has a verdict
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to process (0 = all remaining)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

env:
  # BLAST RADIUS, not a budget (lane: infra, 2026-08-28). The month's ceiling is
  # `pipeline/bd_budget.py`; this stops ONE job's loop running away, which nothing did
  # before -- retry-unreachable could buy 600 credits a night and crack_walled ~2,000,
  # and neither had any limit. Enforced in `bd_rescue.unlock_status`, which every rung
  # here reaches; per PROCESS, so each step gets its own. Unset = unlimited, so this is
  # the only thing that changes for a workflow that does not name it. The `[bd-spend]`
  # line each step now prints is the measurement that should replace this guess.
  BD_RUN_CAP: "250"

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI + Playwright
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      # extract-gap = triage confirmed roles ARE on the stored URL and our extractor missed
      # them. No search needed, so this is the cheapest dark-row mode to repair — and running
      # it FIRST removes those rows from the hunt's pool below.
      # A hostname with no DNS record cannot be rendered, unlocked or cracked — there is
      # nothing there. It can only be fixed by SEARCHING for the real careers page, so this
      # must run BEFORE the hunt or the hunt spends its budget on addresses that don't exist.
      - name: Repair rows whose stored hostname does not resolve
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REPAIR_URL_TIME_BUDGET_MIN: "30"
        run: python repair_dead_urls.py --apply
        continue-on-error: true

      - name: Repair extract-gap rows (re-scrape known URLs with the LLM tier forced)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          REPAIR_TIME_BUDGET_MIN: "35"
          SCRAPE_LLM: "1"
          # paid rung switch: the BD_PAID_RUNGS repo VARIABLE (settings, no commit) or
          # the dispatch input. Off is the EMPTY string, never "0" -- os.environ.get
          # arms on any non-empty value (lane: infra, 2026-08-28).
          # The test is `!= 'off'` and the TRUE branch is '1', which looks backwards and is
          # not: GitHub's `a && b || c` yields c whenever b is FALSY, so `cond && '' || '1'`
          # returns '1' for every input and the switch silently does nothing. Written that
          # way first; an adversarial pass caught it before it shipped. The true branch of
          # one of these must never be '' -- `test_no_workflow_expression_has_a_falsy_true_branch`.
          SCRAPE_VIA_UNLOCKER: ${{ (github.event.inputs.unlocker || vars.BD_PAID_RUNGS || 'on') != 'off' && '1' || '' }}   # these pages 429/403 a datacenter IP; residential wins
        run: python repair_extract_gap.py --apply
        continue-on-error: true

      - name: Hunt listings
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the hunt had NO Bright Data credentials, so google_via_unlocker — its only
          # fallback when DuckDuckGo returns nothing — could never run in the cloud
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          HUNT_LIMIT: ${{ github.event.inputs.limit || '0' }}
          # 200 -> 140: the 60 minutes go to the queue drain below (BACKLOG 427). The job cap
          # is 330 and 140 + 95 (drain) + ~90 (re-crack, ladder, invariants, commit) = 325.
          HUNT_TIME_BUDGET_MIN: "140"
          # This arm is SUPERSEDED, and 0 means OFF (not unlimited). It resolved 2 of 57
          # queue names on 2026-08-29 -- 3.5% -- where `queue_resolve_search` resolves 56%,
          # and both draw from the same research_companies.json, so leaving it on pays twice
          # for the worse answer. Its 60 reserved minutes go back to the row pool.
          HUNT_QUEUE_CAP: "0"
          HUNT_QUEUE_MIN: "0"
          FAST_SCRAPE: "1"
          SCRAPE_LLM: "1"
          SCRAPE_VIA_UNLOCKER: ${{ (github.event.inputs.unlocker || vars.BD_PAID_RUNGS || 'on') != 'off' && '1' || '' }}
        run: python listing_hunt.py --apply
        continue-on-error: true
      # ---------------------------------------------------------------- BACKLOG 427
      # The path from a DISCOVERED NAME to a registry ROW, which ran only when a human ran it.
      # Intake measured over the last 9 days: mean 167/day, median 92 -- against a queue arm
      # capped at 60. This rung resolves 56% of the names it sees where that arm resolves
      # 2-3%, so the reserved queue minutes buy this instead.
      #
      # Proposals only: `queue_resolve_search` writes NO row. Every proposal is verified by
      # `pipeline/board_verify.py` (renders the page, an LLM reads it, and a reading that does
      # not reproduce is UNVERIFIABLE, never ok) before `apply_proposals` sees it -- because
      # the four QA passes on 2026-08-29 refused 10%, 9%, 15% and 19% of proposals as another
      # company's board, and one that slipped through went ACTIVE on a VC's portfolio page.
      - name: Resolve intake names by search (queue drain)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # the default is 150 PER PROCESS and returns [] in SILENCE when reached, which
          # reads exactly like "this company has no board" (BACKLOG 426)
          DEEP_BD_SEARCH_CAP: "500"
        # 4 shards x 30 = 120 names a night at ~55 s/name/shard = ~28 min. Measured intake
        # is a median of 92/day and a mean of 167, so this keeps pace with the median; a
        # 258-name day leaves a residue and the queue stamp is what announces it.
        timeout-minutes: 30
        run: |
          set +e
          for i in 1 2 3 4; do
            QRS_SHARD=$i/4 python -u queue_resolve_search.py \
              --propose "out/qrs_$i.json" --cap 30 &
          done
          wait
          python queue_state.py --ingest "out/qrs_[0-9].json" || true
        continue-on-error: true

      # Verify EVERY proposal before it can become a row, then apply only what passed.
      - name: Verify and apply queue proposals
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        timeout-minutes: 40
        run: python queue_pipeline.py --apply-proposals "out/qrs_[0-9].json" --apply
        continue-on-error: true

      # Re-verify live addresses whose verdict has aged out (30-day cadence), so a monitor
      # row cannot sit unread for ever: `listing_hunt`'s fast path ACTIVATES a parked row the
      # moment its page shows Israel roles, with no model in the loop.
      - name: Re-verify aged registry addresses
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        timeout-minutes: 20
        run: python queue_pipeline.py --verify-existing --limit 60 --apply
        continue-on-error: true

      # A name a rung already settled must not sit in the queue looking owed: nothing can
      # reach it, so it reads as STUCK for ever. Discovery re-adds such names nightly --
      # `Infrastructure Team` (junk) and `Residenthome` (resolved) came back the same night
      # they were retired -- because intake does not consult the disposition record (filed).
      # A LOOKUP: no model, no fetch, no credit.
      - name: Retire queue names a rung already settled
        run: python queue_pipeline.py --retire-settled --apply
        continue-on-error: true

      # The queue's DIRECTION, not its size: a queue of 500 that is falling is healthy and a
      # queue of 200 that is rising is a backlog forming. Two backlogs were found weeks late.
      - name: Stamp the queue (size AND direction)
        if: always()
        run: python queue_pipeline.py --stamp
        continue-on-error: true

      - name: Re-crack walled-ATS rows (daily; hosts already documented)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPE_LLM: "1"
          SCRAPE_VIA_UNLOCKER: ${{ (github.event.inputs.unlocker || vars.BD_PAID_RUNGS || 'on') != 'off' && '1' || '' }}
          CRACK_LIMIT: "400"            # 61 companies sit on walled ATSes; 25 never cleared it
          CRACK_TIME_BUDGET_MIN: "60"
        run: python crack_walled.py --apply || echo "re-crack skipped"
        continue-on-error: true


      # Record that this stage finished, and how much it did. pipeline/stages.py turns the
      # implicit cron ordering into something the next stage can actually READ: the digest
      # warns in its audit block when its prerequisites did not run today, instead of
      # silently building on yesterday's URLs.
      - name: Record the resolution-ladder state (this is the one job with Playwright + Bright Data)
        # rung lines only, to cloud_state/registry_ladder.json; alarms_state re-emits them in
        # the daily mail and reports this file's date when it goes stale. live=False: no spend.
        # The keys MUST be on this step: a step without them records "Bright Data DOWN" as a
        # fact and the mail repeats it daily forever (confirmation-wave R3, B1).
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python registry_health.py --ladder || echo "ladder probe skipped"
        continue-on-error: true
      - name: Stamp the 'repair' stage
        if: always()
        run: python -m pipeline.stages stamp repair
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit verdicts
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "audit-bot" \
            -m "listing-hunt $(date -u +%F) [skip ci]" \
            --own companies.csv scraped_cache.json cloud_state/pipeline_stages.json cloud_state/registry_ladder.json \
            cloud_state/board_verify.json cloud_state/queue_state.json \
            cloud_state/queue_disposition.json cloud_state/queue_receipt.json research_companies.json
