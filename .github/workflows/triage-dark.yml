name: Triage dark rows (classify failure mode, then route)

# Dark rows are NOT one problem. Triage classifies each by failure mode — url-dead,
# extract-gap, js-shell, blocked, acquired, page-empty — and writes the mode into the row
# note. listing_hunt then reads that mode and picks a strategy instead of running the same
# generic attempt on everything (which is why ~348 rows kept failing identically).
#
# Cheap (plain GETs, unlocker only for 403s), so it runs daily before the 14:00 hunt.

on:
  schedule:
    - cron: "0 18 * * *"       # evening: triage -> hunt -> 00:00 refresh -> 05:00 digest,
                               # so a company recovered tonight is in TOMORROW MORNING's
                               # email rather than the one after it
  workflow_dispatch:
    inputs:
      limit:
        description: "rows to triage (0 = all untriaged today)"
        default: "0"
      force:
        description: "re-triage rows already done today (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

env:
  # BLAST RADIUS, not a budget (lane: infra, 2026-08-28). The month's ceiling is
  # `pipeline/bd_budget.py`; this stops ONE job's loop running away, which nothing did
  # before -- retry-unreachable could buy 600 credits a night and crack_walled ~2,000,
  # and neither had any limit. Enforced in `bd_rescue.unlock_status`, which every rung
  # here reaches; per PROCESS, so each step gets its own. Unset = unlimited, so this is
  # the only thing that changes for a workflow that does not name it. The `[bd-spend]`
  # line each step now prints is the measurement that should replace this guess.
  BD_RUN_CAP: "250"

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Claude CLI (render + page-empty confirmation)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Triage
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # paid rung switch: the BD_PAID_RUNGS repo VARIABLE (settings, no commit) or
          # the dispatch input. Off is the EMPTY string, never "0" -- os.environ.get
          # arms on any non-empty value (lane: infra, 2026-08-28).
          # The test is `!= 'off'` and the TRUE branch is '1', which looks backwards and is
          # not: GitHub's `a && b || c` yields c whenever b is FALSY, so `cond && '' || '1'`
          # returns '1' for every input and the switch silently does nothing. Written that
          # way first; an adversarial pass caught it before it shipped. The true branch of
          # one of these must never be '' -- `test_no_workflow_expression_has_a_falsy_true_branch`.
          SCRAPE_VIA_UNLOCKER: ${{ (github.event.inputs.unlocker || vars.BD_PAID_RUNGS || 'on') != 'off' && '1' || '' }}   # a 403 must not be read as "page has no roles"
          TRIAGE_LLM_CAP: "400"      # 200 capped below the 352-row dark pool
          TRIAGE_TIME_BUDGET_MIN: "150"
        run: |
          ARGS="--apply --render --limit ${{ github.event.inputs.limit || '0' }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python triage_dark.py $ARGS
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit modes
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "audit-bot" \
            -m "dark triage $(date -u +%F) [skip ci]" \
            --own companies.csv
