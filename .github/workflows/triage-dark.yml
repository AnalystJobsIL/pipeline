name: Triage dark rows (classify failure mode, then route)

# Dark rows are NOT one problem. Triage classifies each by failure mode — url-dead,
# extract-gap, js-shell, blocked, acquired, page-empty — and writes the mode into the row
# note. listing_hunt then reads that mode and picks a strategy instead of running the same
# generic attempt on everything (which is why ~348 rows kept failing identically).
#
# Cheap (plain GETs, unlocker only for 403s), so it runs daily before the 14:00 hunt.

on:
  schedule:
    - cron: "0 12 * * *"       # 2h before listing-hunt, so the hunt sees fresh modes
  workflow_dispatch:
    inputs:
      limit:
        description: "rows to triage (0 = all untriaged today)"
        default: "0"
      force:
        description: "re-triage rows already done today (true/false)"
        default: "false"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: cp companies.csv /tmp/base.csv || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright (only needed for --render confirmation)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
        continue-on-error: true

      - name: Triage
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          TRIAGE_TIME_BUDGET_MIN: "150"
        run: |
          ARGS="--apply --render --limit ${{ github.event.inputs.limit || '0' }}"
          [ "${{ github.event.inputs.force }}" = "true" ] && ARGS="$ARGS --force"
          python triage_dark.py $ARGS
        continue-on-error: true

      - name: Commit modes
        run: |
          git config user.name  "audit-bot"
          git config user.email "audit@users.noreply.github.com"
          git add companies.csv
          git commit -m "dark triage $(date -u +%F) [skip ci]" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              git rebase --abort 2>/dev/null || true
              rm -rf /tmp/ours && mkdir -p /tmp/ours
              cp companies.csv /tmp/ours/ 2>/dev/null || true
              git fetch origin ${GITHUB_REF_NAME} || true
              git reset --hard origin/${GITHUB_REF_NAME} || true
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours/companies.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours/companies.csv companies.csv || true
              fi
              git add companies.csv || true
              git commit -m "dark triage $(date -u +%F) (row-merged) [skip ci]" || true
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1
