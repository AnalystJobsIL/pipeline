name: Daily jobs digest (cloud)

# Runs the WHOLE pipeline on GitHub's servers every morning, so it works with your PC OFF.
# The seniority step needs Claude; instead of a paid API this uses YOUR Claude subscription
# via an OAuth token (see one-time setup below). No per-token API bill.
#
# ── ONE-TIME SETUP (you must do this once; I can't handle your credentials) ──────────────
#   1. On your PC run:   claude setup-token
#      (log in with your Claude Pro/Max account — it prints a long-lived OAuth token)
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret
#      Name:  CLAUDE_CODE_OAUTH_TOKEN
#      Value: <the token from step 1>
#   3. That's it. This workflow then runs Claude in the cloud on your subscription.
#
# Until the secret exists, the run still works but falls back to deterministic-only
# classification for any job title not already in the committed cache (no crash).
#
# State (which postings were already digested + the LLM/company caches) lives in
# cloud_state/seen.db and is committed back after each run so tomorrow only shows NEW roles.
#
# How a failure reaches you (lane: infra, ARCHITECTURE.md §4): every step has an `id`, the
# pre-steps are continue-on-error WITHOUT a `|| echo` swallow so their outcome is truthful,
# the pipeline step receives `toJSON(steps)` and prints a bold line in the mail for each
# failed one, and the last step (`persist_state.py outcome`, always) records the run in
# cloud_state/last_run.json and -- when the digest itself was lost -- commits a dated
# failure notice as digests/latest.md, so the relay emails THAT instead of silence.

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC ≈ 08:00 Israel (IDT). Adjust as you like.
  workflow_dispatch:
    inputs:
      ignore_cutoff:
        description: "deliver even past the relay's last poll (an operator re-run; still marks nothing sent)"
        type: boolean
        default: false

permissions:
  contents: write             # to commit updated cloud_state back to the repo
  actions: read               # BACKLOG 444: tests.yml's conclusion on master; the cron watch's run list

concurrency:
  group: daily-digest
  cancel-in-progress: false

env:
  # BLAST RADIUS, not a budget (lane: infra, 2026-08-28). The month's ceiling is
  # `pipeline/bd_budget.py`; this stops ONE job's loop running away, which nothing did
  # before -- retry-unreachable could buy 600 credits a night and crack_walled ~2,000,
  # and neither had any limit. Enforced in `bd_rescue.unlock_status`, which every rung
  # here reaches; per PROCESS, so each step gets its own. Unset = unlimited, so this is
  # the only thing that changes for a workflow that does not name it. The `[bd-spend]`
  # line each step now prints is the measurement that should replace this guess.
  BD_RUN_CAP: "250"

jobs:
  digest:
    runs-on: ubuntu-latest
    # per-step timeouts sum to 270 min (each is its script's own budget + headroom); the job
    # cap sits above that sum so the persist/outcome steps are reached by a step failing,
    # never by the job being cancelled from under them (BACKLOG 128). Measured: the whole
    # job ran 32 min on 2026-08-25.
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v5
        with:
          # the cron watch dates every cron from `git log` (a slot is only due once its
          # cron reached the branch); a depth-1 checkout dates nothing and scores nothing
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          # the pinned CLI wants node >= 22 (`npm warn EBADENGINE` on every run at 20.x);
          # the same bump as firmographics.yml, in the file that runs the CLI most (450d)
          node-version: "22"

      - name: Install Claude Code CLI (pinned — the classifier's flags are checked against this version)
        id: cli
        timeout-minutes: 10
        # continue-on-error: the classifier degrades to `missing` and says so in the mail;
        # a flaky npm registry must not skip the whole day (and a skipped pipeline behind a
        # hard-failed step used to mean silence: yesterday's digest re-relayed unlabelled)
        run: npm install -g @anthropic-ai/claude-code@2.1.241
        continue-on-error: true

      - name: Discovery layer (LinkedIn+Indeed via Bright Data, if key set)
        id: discovery
        timeout-minutes: 25
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # How many secrethunter catalog names may enter research_companies.json per run.
          # Raising it does NOT speed up resolution -- auto_expand's free rung is bounded by
          # AUTO_EXPAND_SITE_MAX, which cannot safely rise (see auto-expand.yml). It front-
          # loads the queue, and new names sort to the FRONT of that rung's batch, so it also
          # displaces older job-backed leads. docs/BACKLOG.md 339.
          SECRETHUNTER_QUEUE_CAP: "150"
        run: python discovery_daily.py
        continue-on-error: true

      - name: Telegram-channel discovery (keyless t.me/s preview)
        id: telegram
        timeout-minutes: 10
        run: python discovery_telegram.py
        continue-on-error: true

      - name: Re-test dead domains (plain GETs; ~7-15 min over ~390 rows)
        id: liveness
        timeout-minutes: 20
        run: python scan_dead_domains.py --apply
        continue-on-error: true

      - name: Probe monitored candidates (wake rows whose pages grew job signals)
        id: probe
        timeout-minutes: 15
        run: python probe_candidates.py --apply
        continue-on-error: true

      - name: Enrich scrape-source jobs with JD text (plain fetch, Unlocker fallback)
        id: enrich_scrape
        timeout-minutes: 30
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python enrich_scrape_jd.py
        continue-on-error: true

      # scrape-source JDs live in scraped_cache.json (step above); API-source roles have
      # no cache at all, and four fetchers (workday/smartrecruiters/bamboohr/microsoft)
      # never carry a description. This walks the matched STORE — every role we ever
      # accepted, at any age — and fills the ones still missing their text.
      - name: Backfill JD text for already-matched roles (any age, any source)
        id: enrich_matched
        timeout-minutes: 25
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          MATCHED_JD_TIME_BUDGET_MIN: "20"
        run: python enrich_matched_jd.py --db cloud_state/seen.db
        continue-on-error: true

      - name: Stamp the 'enrich' stage (gap-filler only — never erases the scripts' counts)
        id: stamp_enrich
        if: always()
        run: python -c "from pipeline.jdfill import record_enrich; print(record_enrich())"
        continue-on-error: true

      - name: Alarm when master's own test gate is red (BACKLOG 444)
        id: ci_health
        # tests.yml was non-green on 100 consecutive runs and nothing said so anywhere a
        # human reads daily. Stamps `ci` in pipeline_stages.json; run.py puts it on the
        # mail's Stages: line. BEFORE the pipeline step (which reads the stamps) and before
        # persist (which commits them) -- the filed diff placed it after persist, where the
        # stamp would never have been committed, and a first draft placed it after the
        # pipeline, where the mail would have carried YESTERDAY's verdict (wave 1).
        # `--status completed`: an in-progress run has no conclusion and must not read as
        # "unknown". A `gh` failure is an honest `ci` stamp, never a red step: this runs
        # ahead of the pipeline and a red step here would be a Stages: line about the watch.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # one read of the last 200 completed runs: the newest conclusion, and how many
          # non-green precede the first green (`200+` when none of the 200 is green; `none`
          # when there are no completed runs at all -- never a fabricated streak)
          J=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow tests.yml --branch master \
                --status completed --limit 200 --json conclusion 2>/dev/null || echo '')
          if [ -z "$J" ]; then
            echo "::warning::ci_health: gh could not read tests.yml's runs"
            python -m pipeline.stages stamp ci "alarm=watch could not read tests.yml's runs (gh failed)"
            exit 0
          fi
          CONC=$(printf '%s' "$J" | python -c 'import json,sys; r=json.load(sys.stdin); print(r[0]["conclusion"] if r else "none")')
          RED=$(printf '%s' "$J" | python -c 'import json,sys; r=[x["conclusion"] for x in json.load(sys.stdin)]; print("none" if not r else (str(r.index("success")) if "success" in r else "%d+" % len(r)))')
          echo "tests.yml on master: $CONC ($RED consecutive non-green)"
          if [ "$CONC" != "success" ]; then
            echo "::warning::master test gate $CONC, $RED consecutive non-green"
            python -m pipeline.stages stamp ci "alarm=tests.yml on master is $CONC - $RED consecutive non-green runs" "red_streak=$RED"
          else
            python -m pipeline.stages stamp ci red_streak=0
          fi

      - name: Cron watch (a slot that did not fire, or fired hours late, is a line in the mail)
        id: cron_watch
        # GitHub drops and delays scheduled slots (4 of 5 crons on 2026-08-27; firmographics
        # +293..+662 min on every run it has had) and nothing in this repo noticed a cron
        # that never fired. `tests/schedule_census.py --alarm` scores the last 3 days of
        # every cron in this repo against `gh run list` and `--stamp` writes the `cron`
        # stage; run.py puts it on the Stages: line -- THIS run's, because the step runs
        # before the pipeline. The alarm, not the recovery: the recovery-cron decision is
        # the 2026-09-10 morning check and is not pre-empted here. Under the 720-min grace
        # an evening slot (18:00-20:00) dropped last night reads `pending` this morning and
        # `not seen` tomorrow's: two mornings, by the grace's own rule, never zero.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tests/schedule_census.py --alarm --stamp --days 3

      - name: Company intel drain, bounded (the queue the 05:00 line measures, drained in the run that measures it)
        id: firmo_drain
        # The gap is READ at 05:00; the intake that creates it lands 19:00-22:20 (hunt) and
        # 20:00 (expand); the 10:17 cron at every lag it has ever had (+293..+662 min)
        # finishes BEFORE that intake, so the morning number was structurally a day stale
        # (BACKLOG 450, company-intel's arithmetic, operator 2026-08-30). A second cron was
        # odds, not a mechanism; this is the mechanism: the same drain, in this file, before
        # the step that measures. TWENTY minutes, not sixty -- this is the mail's critical
        # path (the whole job measured 27-32 min); the 10:17 cron keeps `--budget-min 60`
        # as the backlog backstop. continue-on-error: a research failure is a Stages: line
        # (the script stamps `firmo`), never a lost digest. Spends the subscription token
        # only; no Bright Data. `--budget-min` stops LAUNCHING at 20; a call in flight may
        # run 4 more, so the inner budget is 23 under the step's 25, and a killed drain
        # stamps `firmo alarm=step-failed` itself (450c; the same rule as firmographics.yml).
        timeout-minutes: 25
        continue-on-error: true
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          FIRMO_RESEARCH_MODEL: sonnet
          FIRMO_RESEARCH_EFFORT: low
        run: |
          rc=0
          timeout --signal=INT --kill-after=60 23m python research_firmographics.py --workers 2 --budget-min 20 --limit 150 --refresh-days 180 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::company intel drain exited $rc (124/137 = its 23-minute budget)"
            python -m pipeline.stages stamp firmo "alarm=step-failed(rc $rc)"
          fi
          python research_firmographics.py --export
          exit "$rc"

      - name: Run the pipeline (Claude classification via subscription token)
        id: pipeline
        # fetch ~880 boards (~8 min) + classify (60 min budget) + company intel (15) + render
        timeout-minutes: 110
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # the inline JD filler's last rung (BACKLOG 448, jd-text): a LinkedIn guest page is a
          # sign-in wall to a datacenter IP (1 of 14 carried a posting) and the posting to a
          # residential one (5 of 5). Spent only after the free rungs fail. THE CAP IS 30, NOT
          # THE DEFAULT 25: the measured nightly need is 34 minus the shell class (jd-text,
          # 2026-08-30), so 30 leaves the cap non-binding on a normal night -- ~900/month of
          # the 5,000 that begins 2026-09-01. `0` disables the rung. Operator-approved
          # 2026-08-30, held until jd-text named the number.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          JDFILL_BD_CAP: "30"
          # NOTE: SerpApi & JSearch both verified to NOT cover Israel (google_jobs rejects
          # gl=il, location=Israel returns 0). Aggregator left OFF (AGGREGATOR_ENABLED unset).
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BOARD_URL: "https://analystjobsil.github.io/board/"
          # the publish step copies cloud_state/roles.csv beside the board (roles lane, 453);
          # the meta file may read this instead of a hard-coded `published_on_pages: false`
          ROLES_PAGES_URL: "https://analystjobsil.github.io/board/roles.csv"
          # inline JD fetch for roles whose ATS list response carries no description —
          # the LLM tier reads the description, so this happens BEFORE classification
          JDFILL: "1"
          JDFILL_TIME_BUDGET_MIN: "25"
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # the receipt `deliver` writes records which run put today's digest in the mail
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # THE CUTOFF IS A PROPERTY OF THE TRIGGER, NOT OF THE CLOCK (2026-08-28).
          # `deliver` defers a digest written after the relay's last poll because no poller
          # would ever see it. Once `notify_relay` below can hand the relay an EVENT, that
          # reason is gone -- and leaving 10:17 in place would keep withholding mail the new
          # path could deliver. On 2026-08-27 the digest ran at 16:18 and was refused for
          # exactly this reason, so the operator got nothing at all that day.
          # So: with the deploy key configured the deadline moves to 23:39 (23:59 less
          # DELIVER_MARGIN_MIN, keeping the arithmetic inside the same UTC day); without it
          # the old 10:17 still holds, because then the cron poll really is the only reader.
          # Truthy true-branch on purpose -- `cond && '' || x` yields x for every input.
          RELAY_LAST_POLL_UTC: ${{ secrets.INBOX_DEPLOY_KEY != '' && '23:39' || '10:17' }}
          # the pre-steps' outcomes: a failed one is a bold `Stages:` line in the mail
          WORKFLOW_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p cloud_state out digests
          python -m pipeline.run --db cloud_state/seen.db
          # NOT a bare `cp` (2026-08-27). `digests/latest.md` IS the mail, and copying over
          # it unconditionally is what made a second same-day run dangerous: `filter_new`
          # has already drained `sent`, so run #2 renders `0 new senior analytics roles`,
          # the relay sees new bytes and mails an EMPTY digest over the real morning's.
          # `deliver` refuses a weaker same-date replacement, DEFERS past the relay's last
          # poll rather than marking roles sent that can no longer be mailed (it exports
          # DIGEST_JSON only when the digest landed, which is what leaves the `mark_sent`
          # step below a no-op), and writes cloud_state/last_delivered.json -- committed by
          # the persist step in the SAME commit as latest.md, never as a second writer.
          # ARCHITECTURE section 4. It still exits 1 when the run wrote no digest at all.
          python persist_state.py deliver --date "$(date -u +%F)" \
            ${{ github.event.inputs.ignore_cutoff == 'true' && '--ignore-cutoff' || '' }}

      # The marks (sqlite `sent` + the ledger mirror) and digests/latest.md land in ONE commit
      # below, so a persist failure burns nothing; the only window left is the relay itself
      # (BACKLOG 6). A mark_sent crash must not withhold the digest: continue-on-error, and
      # its failure reaches tomorrow's mail through cloud_state/last_run.json.
      - name: Mark digested roles as sent
        id: mark_sent
        run: |
          if [ -n "$DIGEST_JSON" ] && [ -s "$DIGEST_JSON" ]; then
            python mark_sent.py "$DIGEST_JSON" --db cloud_state/seen.db
          else
            echo "nothing to mark sent (no digest payload this run)"
          fi
        continue-on-error: true

      - name: Invariant guard (blocks a corrupted registry from being committed)
        id: gate
        run: python check_invariants.py

      - name: Re-baseline the registry census (only a registry that passed the gate)
        id: census
        # AFTER the hard invariant guard on purpose: a census taken before it would bless a
        # corrupted registry as the new baseline, and the deletion registry_health exists
        # to report would be invisible from then on. The alarms the pipeline mailed this
        # morning were judged against YESTERDAY's census. No env, no network, ~0.3s.
        run: python registry_health.py --census
        continue-on-error: true

      - name: Persist state back to the repo
        id: persist
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule
        # (pipeline_stages.json per stage key, the caches per company, the registry per
        # row) instead of copying a checkout-era copy over origin's newer one.
        # `if: always()`: a crash or a timeout no longer discards the LLM verdicts and
        # caches the run paid for (BACKLOG 39/128). companies.csv MUST be here:
        # probe_candidates.py clears verdicts on woken rows, and cloud_state/candidate_probe.json
        # advances the baseline — without committing the csv the wake is lost AND its signal
        # is consumed forever. Persist runs BEFORE the board publish on purpose.
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "github-actions[bot]" \
            -m "cloud run: state + digest for $(date -u +%F) [skip ci]" \
            --own cloud_state digests/latest.md discovered_cache.json scraped_cache.json \
                  research_companies.json companies.csv docs/index.html docs/archive.html

      - name: Publish the 2-week board to the public org repo (needs BOARD_DEPLOY_KEY)
        id: publish
        # a red persist (one refused file, the rest pushed) must not cost the board a day
        if: ${{ !cancelled() && steps.pipeline.outcome == 'success' }}
        timeout-minutes: 10
        env:
          DEPLOY_KEY: ${{ secrets.BOARD_DEPLOY_KEY }}
          TOKEN: ${{ secrets.BOARD_DEPLOY_TOKEN }}
        run: |
          [ -z "$DEPLOY_KEY" ] && [ -z "$TOKEN" ] && { echo "::error::no board credentials set; board NOT published"; exit 1; }
          [ -s docs/index.html ] || { echo "::error::docs/index.html is empty; board NOT published"; exit 1; }
          if [ -n "$DEPLOY_KEY" ]; then
            # SSH deploy key scoped to AnalystJobsIL/board (write); survives PAT expiry/policy issues
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/board_deploy_key
            chmod 600 ~/.ssh/board_deploy_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/board_deploy_key -o IdentitiesOnly=yes"
            BOARD_URL_GIT="git@github.com:AnalystJobsIL/board.git"
          else
            BOARD_URL_GIT="https://x-access-token:${TOKEN}@github.com/AnalystJobsIL/board.git"
          fi
          rm -rf /tmp/board && git clone -q "$BOARD_URL_GIT" /tmp/board
          cp docs/index.html /tmp/board/index.html
          # optional files: copied only when NON-EMPTY, so a zero-byte artefact from a broken
          # step never overwrites the board's good copy (roles lane, BACKLOG 453)
          for f in docs/archive.html cloud_state/roles.csv cloud_state/roles.csv.meta.json cloud_state/funnel.csv; do
            if [ -s "$f" ]; then cp "$f" "/tmp/board/$(basename "$f")"
            elif [ -e "$f" ]; then echo "::warning::$f is empty; the board keeps its previous copy"
            fi
          done
          cd /tmp/board
          BR=$(git symbolic-ref --short HEAD)     # board repo's default branch is main, not master
          git config user.name  "board-bot"
          git config user.email "board@users.noreply.github.com"
          git add index.html
          for f in archive.html roles.csv roles.csv.meta.json funnel.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git commit -m "board $(date -u +%F)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BR" && git push origin "HEAD:$BR" && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*20))
          done
          echo "::error::board push failed"; exit 1

      - name: Report the run's outcome (a lost digest becomes a mailed notice; any failure reaches tomorrow's mail)
        id: outcome
        if: always()
        timeout-minutes: 5
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # commits cloud_state/last_run.json (+ digests/latest.md when the digest was lost)
        # ALONE, from a fresh worktree of origin/master -- never this checkout's tree
        run: python persist_state.py outcome --commit

      - name: Hand the relay its event (its cron is the backup, not the path)
        id: notify_relay
        # LAST, and `if: always()`, on purpose: the `outcome` step above can replace
        # digests/latest.md with a dated failure notice, and a lost morning is exactly when
        # the mail matters most, so the notice must reach the event path too.
        #
        # WHY THIS EXISTS. The relay in the private inbox repo had only a clock, and on
        # 2026-08-28 GitHub fired ZERO of its four scheduled polls while this pipeline
        # delivered correctly at 07:08 -- the mail went out only because a human dispatched
        # it. `tests/schedule_census.py` measures 0 isolated single-slot drops: the scheduler
        # fails as ONE thing, so redundancy inside it cannot help and only a non-schedule
        # trigger can. docs/decisions/2026-08-28-relay-trigger.md has the alternatives.
        #
        # A DEPLOY KEY, not a PAT: it belongs to a REPO rather than a person, so no run page
        # names the owner (CLAUDE.local.md section 3) and it cannot expire silently -- a dead
        # PAT would reproduce exactly the failure this fixes, with no alarm. The repo address
        # is a secret too, so THIS FILE names no private repository -- which is a narrow
        # claim on purpose: `AnalystJobsIL/inbox` is named in ARCHITECTURE.md, CLAUDE.md
        # and docs/AUTOMATION.md already. That is not an identity breach (it names an ORG
        # repo, never the personal account), and the secret is here so the address is not
        # ALSO in the file that holds the key to it.
        #
        # It pushes the digest BODY, not just its hash. Reading it back from
        # raw.githubusercontent is what an adversarial pass killed: that CDN serves a stale
        # copy for up to 300 s, longer than any retry budget worth having, so the relay would
        # mail yesterday's digest -- or match yesterday's hash, dedup, and mail NOTHING, which
        # looks identical to success. Handing over the bytes deletes the whole failure class.
        #
        # continue-on-error: this step must never turn a morning the mail shipped into a red
        # run. Two adversarial passes found that `git fetch`/`clone`/`ssh-keyscan` abort under
        # the runner's `bash -e` with no `exit 1` anywhere -- which is why the guard on this
        # asserts continue-on-error rather than grepping the script.
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          DEPLOY_KEY: ${{ secrets.INBOX_DEPLOY_KEY }}
          INBOX_GIT: ${{ secrets.INBOX_REPO_GIT }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # whitespace-tolerant: a key pasted with a stray space passed `-z` and then died at
          # `git clone`, which was a red job for a mistake this can just report
          if [ -z "$(printf %s "$DEPLOY_KEY" | tr -d '[:space:]')" ] ||              [ -z "$(printf %s "$INBOX_GIT" | tr -d '[:space:]')" ]; then
            echo "relay notification not configured (INBOX_DEPLOY_KEY / INBOX_REPO_GIT unset)"
            echo "-- the relay's four cron polls remain the only path to the mail."
            exit 0
          fi
          # what a reader will actually get: origin's copy, AFTER every step above pushed.
          # Not this checkout's tree -- `outcome` commits from a worktree of its own.
          git fetch -q origin "$BRANCH" || { echo "::warning::fetch failed; relay not notified"; exit 0; }
          git show "origin/$BRANCH:digests/latest.md" > landed.md 2>/dev/null || {
            echo "::warning::origin carries no digests/latest.md; nothing to relay"; exit 0; }
          [ -s landed.md ] || { echo "::warning::origin's digest is empty; not relaying"; exit 0; }
          # ONLY today's file. A deferred day leaves YESTERDAY's digest on origin, and
          # announcing that re-mails it or -- worse -- deduplicates against it so the day
          # goes quiet. Both the digest H1 and the failure notice carry the run date.
          TODAY="$(date -u +%F)"
          case "$(head -1 landed.md)" in
            *"$TODAY"*) : ;;
            *) echo "origin's digest is not dated $TODAY; nothing delivered today, not relaying"
               exit 0;;
          esac
          SHA="$(sha256sum landed.md | cut -d' ' -f1)"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/inbox_deploy_key
          chmod 600 ~/.ssh/inbox_deploy_key
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/inbox_deploy_key -o IdentitiesOnly=yes"
          rm -rf /tmp/inbox
          git clone -q --depth 1 "$INBOX_GIT" /tmp/inbox || {
            echo "::warning::could not reach the relay repo; its cron polls remain"; exit 0; }
          mkdir -p /tmp/inbox/receipts
          cp landed.md /tmp/inbox/receipts/latest.md
          # sha + first line ONLY: no timestamp, no run URL. With either of those the file
          # changed on every run, `git commit` never no-op'd, and every run woke the relay --
          # which is the traffic that makes two overlapping relay runs reachable.
          printf '{"sha256":"%s"}\n' "$SHA" > /tmp/inbox/receipts/latest.json
          cd /tmp/inbox
          # never GUESS the branch: this repo's default is `master`, and pushing to an
          # invented `main` puts the receipt on a ref the relay does not watch -- a
          # silent no-mail. Verified 2026-08-28 by doing exactly that by hand.
          if ! BR="$(git symbolic-ref --short HEAD)"; then
            echo "::warning::cannot read the relay repo's default branch; not pushing"
            exit 0
          fi
          git config user.name  "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add receipts/latest.md receipts/latest.json
          git commit -q -m "digest $TODAY ${SHA:0:12}" || { echo "same digest already announced"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull -q --rebase --autostash origin "$BR" && git push -q origin "HEAD:$BR" && {
              echo "relay notified: $SHA"; exit 0; }
            git rebase --abort 2>/dev/null || true; sleep $((i*10))
          done
          # NEVER fatal: the mail is not lost, it is merely back on the cron's schedule.
          echo "::warning::could not notify the relay; its cron polls remain"

