name: Daily jobs digest (cloud)

# Runs the WHOLE pipeline on GitHub's servers every morning, so it works with your PC OFF.
# The seniority step needs Claude; instead of a paid API this uses YOUR Claude subscription
# via an OAuth token (see one-time setup below). No per-token API bill.
#
# ── ONE-TIME SETUP (you must do this once; I can't handle your credentials) ──────────────
#   1. On your PC run:   claude setup-token
#      (log in with your Claude Pro/Max account — it prints a long-lived OAuth token)
#   2. GitHub → this repo → Settings → Secrets and variables → Actions → New repository secret
#      Name:  CLAUDE_CODE_OAUTH_TOKEN
#      Value: <the token from step 1>
#   3. That's it. This workflow then runs Claude in the cloud on your subscription.
#
# Until the secret exists, the run still works but falls back to deterministic-only
# classification for any job title not already in the committed cache (no crash).
#
# State (which postings were already digested + the LLM/company caches) lives in
# cloud_state/seen.db and is committed back after each run so tomorrow only shows NEW roles.
#
# How a failure reaches you (lane: infra, ARCHITECTURE.md §4): every step has an `id`, the
# pre-steps are continue-on-error WITHOUT a `|| echo` swallow so their outcome is truthful,
# the pipeline step receives `toJSON(steps)` and prints a bold line in the mail for each
# failed one, and the last step (`persist_state.py outcome`, always) records the run in
# cloud_state/last_run.json and -- when the digest itself was lost -- commits a dated
# failure notice as digests/latest.md, so the relay emails THAT instead of silence.

on:
  schedule:
    - cron: "0 5 * * *"      # 05:00 UTC ≈ 08:00 Israel (IDT). Adjust as you like.
  workflow_dispatch: {}

permissions:
  contents: write             # to commit updated cloud_state back to the repo

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # per-step timeouts sum to 270 min (each is its script's own budget + headroom); the job
    # cap sits above that sum so the persist/outcome steps are reached by a step failing,
    # never by the job being cancelled from under them (BACKLOG 128). Measured: the whole
    # job ran 32 min on 2026-08-25.
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI (pinned — the classifier's flags are checked against this version)
        id: cli
        timeout-minutes: 10
        # continue-on-error: the classifier degrades to `missing` and says so in the mail;
        # a flaky npm registry must not skip the whole day (and a skipped pipeline behind a
        # hard-failed step used to mean silence: yesterday's digest re-relayed unlabelled)
        run: npm install -g @anthropic-ai/claude-code@2.1.241
        continue-on-error: true

      - name: Discovery layer (LinkedIn+Indeed via Bright Data, if key set)
        id: discovery
        timeout-minutes: 25
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python discovery_daily.py
        continue-on-error: true

      - name: Telegram-channel discovery (keyless t.me/s preview)
        id: telegram
        timeout-minutes: 10
        run: python discovery_telegram.py
        continue-on-error: true

      - name: Re-test dead domains (plain GETs; ~7-15 min over ~390 rows)
        id: liveness
        timeout-minutes: 20
        run: python scan_dead_domains.py --apply
        continue-on-error: true

      - name: Probe monitored candidates (wake rows whose pages grew job signals)
        id: probe
        timeout-minutes: 15
        run: python probe_candidates.py --apply
        continue-on-error: true

      - name: Enrich scrape-source jobs with JD text (plain fetch, Unlocker fallback)
        id: enrich_scrape
        timeout-minutes: 30
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python enrich_scrape_jd.py
        continue-on-error: true

      # scrape-source JDs live in scraped_cache.json (step above); API-source roles have
      # no cache at all, and four fetchers (workday/smartrecruiters/bamboohr/microsoft)
      # never carry a description. This walks the matched STORE — every role we ever
      # accepted, at any age — and fills the ones still missing their text.
      - name: Backfill JD text for already-matched roles (any age, any source)
        id: enrich_matched
        timeout-minutes: 25
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          MATCHED_JD_TIME_BUDGET_MIN: "20"
        run: python enrich_matched_jd.py --db cloud_state/seen.db
        continue-on-error: true

      - name: Stamp the 'enrich' stage (gap-filler only — never erases the scripts' counts)
        id: stamp_enrich
        if: always()
        run: python -c "from pipeline.jdfill import record_enrich; print(record_enrich())"
        continue-on-error: true

      - name: Run the pipeline (Claude classification via subscription token)
        id: pipeline
        # fetch ~880 boards (~8 min) + classify (60 min budget) + company intel (15) + render
        timeout-minutes: 110
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # NOTE: SerpApi & JSearch both verified to NOT cover Israel (google_jobs rejects
          # gl=il, location=Israel returns 0). Aggregator left OFF (AGGREGATOR_ENABLED unset).
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          BOARD_URL: "https://analystjobsil.github.io/board/"
          # inline JD fetch for roles whose ATS list response carries no description —
          # the LLM tier reads the description, so this happens BEFORE classification
          JDFILL: "1"
          JDFILL_TIME_BUDGET_MIN: "25"
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE }}
          # the pre-steps' outcomes: a failed one is a bold `Stages:` line in the mail
          WORKFLOW_STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: |
          mkdir -p cloud_state out digests
          python -m pipeline.run --db cloud_state/seen.db
          DATE=$(date -u +%F)
          if [ -f "out/digest-${DATE}.md" ]; then
            cp "out/digest-${DATE}.md" digests/latest.md
            echo "DIGEST_JSON=out/digest-${DATE}.json" >> "$GITHUB_ENV"
          else
            # a green run with no digest file (a dispatch straddling UTC midnight) would
            # otherwise be a silent day: no mail, no notice
            echo "::error::pipeline exited 0 but wrote no out/digest-${DATE}.md"; exit 1
          fi

      # The marks (sqlite `sent` + the ledger mirror) and digests/latest.md land in ONE commit
      # below, so a persist failure burns nothing; the only window left is the relay itself
      # (BACKLOG 6). A mark_sent crash must not withhold the digest: continue-on-error, and
      # its failure reaches tomorrow's mail through cloud_state/last_run.json.
      - name: Mark digested roles as sent
        id: mark_sent
        run: |
          if [ -n "$DIGEST_JSON" ] && [ -s "$DIGEST_JSON" ]; then
            python mark_sent.py "$DIGEST_JSON" --db cloud_state/seen.db
          else
            echo "nothing to mark sent (no digest payload this run)"
          fi
        continue-on-error: true

      - name: Invariant guard (blocks a corrupted registry from being committed)
        id: gate
        run: python check_invariants.py

      - name: Re-baseline the registry census (only a registry that passed the gate)
        id: census
        # AFTER the hard invariant guard on purpose: a census taken before it would bless a
        # corrupted registry as the new baseline, and the deletion registry_health exists
        # to report would be invisible from then on. The alarms the pipeline mailed this
        # morning were judged against YESTERDAY's census. No env, no network, ~0.3s.
        run: python registry_health.py --census
        continue-on-error: true

      - name: Persist state back to the repo
        id: persist
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule
        # (pipeline_stages.json per stage key, the caches per company, the registry per
        # row) instead of copying a checkout-era copy over origin's newer one.
        # `if: always()`: a crash or a timeout no longer discards the LLM verdicts and
        # caches the run paid for (BACKLOG 39/128). companies.csv MUST be here:
        # probe_candidates.py clears verdicts on woken rows, and cloud_state/candidate_probe.json
        # advances the baseline — without committing the csv the wake is lost AND its signal
        # is consumed forever. Persist runs BEFORE the board publish on purpose.
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "github-actions[bot]" \
            -m "cloud run: state + digest for $(date -u +%F) [skip ci]" \
            --own cloud_state digests/latest.md discovered_cache.json scraped_cache.json \
                  research_companies.json companies.csv docs/index.html docs/archive.html

      - name: Publish the 2-week board to the public org repo (needs BOARD_DEPLOY_KEY)
        id: publish
        # a red persist (one refused file, the rest pushed) must not cost the board a day
        if: ${{ !cancelled() && steps.pipeline.outcome == 'success' }}
        timeout-minutes: 10
        env:
          DEPLOY_KEY: ${{ secrets.BOARD_DEPLOY_KEY }}
          TOKEN: ${{ secrets.BOARD_DEPLOY_TOKEN }}
        run: |
          [ -z "$DEPLOY_KEY" ] && [ -z "$TOKEN" ] && { echo "::error::no board credentials set; board NOT published"; exit 1; }
          [ -s docs/index.html ] || { echo "::error::docs/index.html is empty; board NOT published"; exit 1; }
          if [ -n "$DEPLOY_KEY" ]; then
            # SSH deploy key scoped to AnalystJobsIL/board (write); survives PAT expiry/policy issues
            mkdir -p ~/.ssh && chmod 700 ~/.ssh
            printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/board_deploy_key
            chmod 600 ~/.ssh/board_deploy_key
            ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
            export GIT_SSH_COMMAND="ssh -i ~/.ssh/board_deploy_key -o IdentitiesOnly=yes"
            BOARD_URL_GIT="git@github.com:AnalystJobsIL/board.git"
          else
            BOARD_URL_GIT="https://x-access-token:${TOKEN}@github.com/AnalystJobsIL/board.git"
          fi
          rm -rf /tmp/board && git clone -q "$BOARD_URL_GIT" /tmp/board
          cp docs/index.html /tmp/board/index.html
          cp docs/archive.html /tmp/board/archive.html 2>/dev/null || true
          cd /tmp/board
          BR=$(git symbolic-ref --short HEAD)     # board repo's default branch is main, not master
          git config user.name  "board-bot"
          git config user.email "board@users.noreply.github.com"
          git add index.html
          [ -f archive.html ] && git add archive.html
          git commit -m "board $(date -u +%F)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin "$BR" && git push origin "HEAD:$BR" && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*20))
          done
          echo "::error::board push failed"; exit 1

      - name: Report the run's outcome (a lost digest becomes a mailed notice; any failure reaches tomorrow's mail)
        id: outcome
        if: always()
        timeout-minutes: 5
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # commits cloud_state/last_run.json (+ digests/latest.md when the digest was lost)
        # ALONE, from a fresh worktree of origin/master -- never this checkout's tree
        run: python persist_state.py outcome --commit

