name: Refresh scrape cache (cloud)

# Re-scrapes the custom / server-rendered career sites (ats_platform = "scrape") with Playwright
# and commits scraped_cache.json. The daily digest reads that cache, so this keeps the scraped
# companies (Meta, Cato, and the custom Israeli SPAs) current without your PC — runs a few times a
# week because Playwright rendering is slow.

on:
  schedule:
    - cron: "0 0 * * *"        # daily 00:00 UTC (was Mon/Thu — quota fossil; minutes now free)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: cp companies.csv /tmp/base.csv || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Refresh the scrape cache
        env:
          # strategy 5 (Claude reads the rendered page) — without it, layouts only the LLM
          # can parse silently yield 0 here and the row rots despite having roles
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRAPE_LLM: "1"
        run: python refresh_scrape_cache.py

      - name: Commit updated cache
        run: |
          git config user.name  "scrape-bot"
          git config user.email "scrape@users.noreply.github.com"
          git add scraped_cache.json cloud_state/scrape_rot.json companies.csv
          git commit -m "scrape cache refresh $(date -u +%F) [skip ci]" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              # CONFLICT on companies.csv: rebase can't merge it, and giving up here
              # discards the whole run (3.5h listing-hunt lost 2026-08-22). Re-apply just
              # THIS run's row changes onto origin's current file and retry.
              git rebase --abort 2>/dev/null || true
              cp companies.csv /tmp/ours.csv 2>/dev/null || true
              git fetch origin ${GITHUB_REF_NAME}
              git reset --hard origin/${GITHUB_REF_NAME}
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours.csv companies.csv || true
                git add companies.csv
                git commit -m "row-merged state $(date -u +%F) [skip ci]" || true
              fi
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1

