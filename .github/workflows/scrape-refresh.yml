name: Refresh scrape cache (cloud)

# Re-scrapes the custom / server-rendered career sites (ats_platform = "scrape") with Playwright
# and commits scraped_cache.json. The daily digest reads that cache, so this keeps the scraped
# companies (Meta, Cato, and the custom Israeli SPAs) current without your PC — runs a few times a
# week because Playwright rendering is slow.

on:
  schedule:
    - cron: "0 0 * * *"        # daily 00:00 UTC (was Mon/Thu — quota fossil; minutes now free)
  workflow_dispatch:
    inputs:
      unlocker:
        description: "paid residential rung: on | off (default: the BD_PAID_RUNGS repo variable)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium + Claude CLI (strategy 5 needs the CLI)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code

      - name: Decide whether this run may buy Bright Data credits
        # ONE place decides, and it says so on the run page. Two things can turn the paid
        # residential rung off: the `BD_PAID_RUNGS` repo VARIABLE (settings, no commit — a
        # paid rung must not be switchable only by editing a workflow file) or the dispatch
        # input, for one run. On top of that `pipeline.bd_budget` refuses when the month's
        # ceiling is reached — unlimited through August 2026, 5,000 from 2026-09-01, and it
        # reads the LIVE account because every cap in this repo is per-process and no
        # credit ledger exists here. An unreadable balance SPENDS (fails open); the bound
        # that does not need the network is BD_RUN_CAP on the step below.
        env:
          SWITCH: ${{ (github.event.inputs.unlocker || vars.BD_PAID_RUNGS || 'on') == 'off' && 'off' || 'on' }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: |
          ON=1
          if [ "$SWITCH" = "off" ]; then
            echo "paid rungs OFF by switch (BD_PAID_RUNGS / dispatch input)"; ON=""
          elif ! python -m pipeline.bd_budget; then
            echo "paid rungs OFF: the monthly ceiling is reached"; ON=""
          fi
          # empty, never "0" — every reader is os.environ.get(), which arms on any non-empty
          # value, so a flag that reads 0 and means ON is the trap this control removes
          echo "SCRAPE_VIA_UNLOCKER=$ON" >> "$GITHUB_ENV"
          echo "paid residential rung: ${ON:+ON}${ON:-OFF}" >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh the scrape cache
        env:
          # strategy 5 (Claude reads the rendered page) — without it, layouts only the LLM
          # can parse silently yield 0 here and the row rots despite having roles
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCRAPE_LLM: "1"
          # A page that 403s a datacenter IP looked identical to "no roles" here, so
          # bot-walled companies scored an empty scrape every night. scrape_universal has
          # had a residential-unlocker fallback all along, gated behind this flag, which
          # was set in NO workflow — so it had never once fired in production.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          # SCRAPE_VIA_UNLOCKER is NOT set here: the preflight step above exports it, so the
          # switch and the monthly ceiling are decided in one place instead of two.
          # What ONE job may buy, enforced in bd_rescue for every rung that reaches the
          # account. 72 credits measured on 2026-08-28 (63 returned a page, 10 won a board);
          # 150 is headroom over that, not a target. Before this the answer was "no limit".
          BD_RUN_CAP: "150"
          # 425 active scrape rows on 2026-08-24 (862 active rows in total), ~40 min with
          # the 4-process pool. Stop with headroom under timeout-minutes: 330 so the cache is
          # actually written and committed — a timeout discards the whole run.
          SCRAPE_REFRESH_TIME_BUDGET_MIN: "260"
        run: python refresh_scrape_cache.py


      # The 'collect' stage is stamped by refresh_scrape_cache.py itself, WITH its counts
      # (scraped/with_jobs/empty/errors/alarm), and the digest prints that line in its audit.
      # A separate `stages stamp collect` step used to run here `if: always()` — it replaced
      # the counts with `{}` and reported "collect: TODAY" even when the script had crashed.

      - name: What this run spent
        # CLAUDE.md rule 1: say what it PRODUCED. Until 2026-08-28 the night's credits were
        # in cloud_state/pipeline_stages.json and nowhere a human looked, so nobody noticed
        # a hardcoded flag buying 72 credits for 10 boards, every night, unattended.
        if: always()
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          try:
              c = json.load(open("cloud_state/pipeline_stages.json", encoding="utf-8"))["collect"]
          except Exception as e:
              print(f"- collect stamp unreadable: {e}")
          else:
              calls, ok, won = (c.get(k, 0) for k in ("unlock_calls", "unlock_ok", "unlock_won"))
              print(f"- Bright Data this run: **{calls} credits** -> {ok} pages -> "
                    f"**{won} boards won**" if calls else "- Bright Data this run: 0 credits")
              print(f"- cache: {c.get('with_jobs', '?')} of {c.get('rows', '?')} rows carry jobs; "
                    f"{c.get('empty', '?')} empty, {c.get('errors', '?')} errored")
          PY
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit updated cache
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "scrape-bot" \
            -m "scrape cache refresh $(date -u +%F) [skip ci]" \
            --own scraped_cache.json cloud_state/scrape_rot.json companies.csv cloud_state/pipeline_stages.json

# (workflow re-index nudge)
