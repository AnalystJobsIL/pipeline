name: Auto-expand coverage (cloud, self-draining)

# Keeps cracking companies until none are left. Every run resolves the next batch of researched-
# but-not-yet-added companies (iframe-ATS / scrape / follow-jobs-link) and commits them into
# companies.csv + scraped_cache.json. Runs several times a day; because each run shrinks the
# unresolved set, it converges to full coverage on its own — PC off, no babysitting.

on:
  schedule:
    - cron: "0 8,20 * * *"       # twice daily (avoids the 05:00 digest slot)
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to process this run"
        default: "200"
      llm_cap:
        description: "max LLM resolution attempts this run"
        default: "10"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI (LLM fallback resolver)
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve the next batch
        env:
          AUTO_EXPAND_LIMIT: ${{ github.event.inputs.limit || '250' }}
          # LLM fallback tier (resolve_llm.py): subscription token + web search for
          # finding real careers pages behind aggregator links. Both optional — without
          # them the deterministic tiers run exactly as before.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LLM_RESOLVE_CAP: ${{ github.event.inputs.llm_cap || '10' }}
          # The tier's search ladder (resolve_llm): SerpApi -> DuckDuckGo -> Google via the
          # unlocker. The paid rung is capped per run (2 runs/day at 5 ~= 7% of the 4,500
          # monthly ceiling); a name enters the tier at most AUTO_EXPAND_SEARCH_CAP times.
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          LLM_BD_SEARCH_CAP: "5"
          AUTO_EXPAND_SEARCH_CAP: "40"
        run: python auto_expand.py


      # Record that this stage finished, and how much it did. pipeline/stages.py turns the
      # implicit cron ordering into something the next stage can actually READ: the digest
      # warns in its audit block when its prerequisites did not run today, instead of
      # silently building on yesterday's URLs.
      - name: Stamp the 'expand' stage
        if: always()
        run: python -m pipeline.stages stamp expand
        continue-on-error: true

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit newly-cracked companies
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "expand-bot" \
            -m "auto-expand: crack more companies $(date -u +%FT%H:%M) [skip ci]" \
            --own companies.csv scraped_cache.json cloud_state/pipeline_stages.json \
                  cloud_state/auto_expand_seen.json

# (workflow re-index nudge)
