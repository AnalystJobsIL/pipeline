name: Auto-expand coverage (cloud, self-draining)

# Keeps cracking companies until none are left. Every run resolves the next batch of researched-
# but-not-yet-added companies (iframe-ATS / scrape / follow-jobs-link) and commits them into
# companies.csv + scraped_cache.json. Runs several times a day; because each run shrinks the
# unresolved set, it converges to full coverage on its own — PC off, no babysitting.

on:
  schedule:
    - cron: "0 8,20 * * *"       # twice daily (avoids the 05:00 digest slot)
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to process this run"
        default: "200"
      llm_cap:
        description: "max LLM resolution attempts this run"
        default: "10"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: cp companies.csv /tmp/base.csv || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Claude Code CLI (LLM fallback resolver)
        run: npm install -g @anthropic-ai/claude-code

      - name: Resolve the next batch
        env:
          AUTO_EXPAND_LIMIT: ${{ github.event.inputs.limit || '250' }}
          # LLM fallback tier (resolve_llm.py): subscription token + web search for
          # finding real careers pages behind aggregator links. Both optional — without
          # them the deterministic tiers run exactly as before.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          LLM_RESOLVE_CAP: ${{ github.event.inputs.llm_cap || '10' }}
        run: python auto_expand.py

      - name: Commit newly-cracked companies
        run: |
          git config user.name  "expand-bot"
          git config user.email "expand@users.noreply.github.com"
          git add companies.csv scraped_cache.json
          git commit -m "auto-expand: crack more companies $(date -u +%FT%H:%M) [skip ci]" \
            || { echo "nothing new this run"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              # CONFLICT on companies.csv: rebase can't merge it, and giving up here
              # discards the whole run (3.5h listing-hunt lost 2026-08-22). Re-apply just
              # THIS run's row changes onto origin's current file and retry.
              git rebase --abort 2>/dev/null || true
              cp companies.csv /tmp/ours.csv 2>/dev/null || true
              git fetch origin ${GITHUB_REF_NAME}
              git reset --hard origin/${GITHUB_REF_NAME}
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours.csv companies.csv || true
                git add companies.csv
                git commit -m "row-merged state $(date -u +%F) [skip ci]" || true
              fi
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1

# (workflow re-index nudge)
