name: Self-heal ATS coverage (re-resolve stale boards)

# Coverage rots silently: a company moves Workday tenant, changes its Greenhouse slug, or
# turns on anti-bot, and its board quietly returns 0 forever. Detection is now FREE + DAILY —
# pipeline.run records a stale list (cloud_state/stale.json) as a byproduct of the digest's
# fetch. This job re-resolves that list DAILY (headless capture, escalating to the Bright Data
# unlocker for anti-bot sites) and commits the corrected companies.csv. Mondays it also does a
# full independent health sweep as a backstop. Whatever it can't fix, discovery backfills. PC off.

on:
  schedule:
    - cron: "0 6 * * *"          # daily 06:00 UTC (after the 05:00 digest commits stale.json)
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated company names to re-resolve (blank = all stale)"
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: |
          cp companies.csv /tmp/base.csv || true
          cp scraped_cache.json /tmp/base_cache.json || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Weekly full health sweep (Mondays — backstop to daily inline detection)
        run: |
          # Daily detection already wrote cloud_state/stale.json as a byproduct of the digest.
          # On Mondays, also run the full independent sweep to catch slow drift.
          if [ "$(date -u +%u)" = "1" ]; then python -u health_check.py; \
          else echo "not Monday — re-resolving today's daily-detected stale.json"; fi

      - name: Re-resolve stale boards (Bright Data unlocker for anti-bot sites)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -u resolve_broken.py --only "$ONLY";
          else python -u resolve_broken.py; fi

      - name: Apply resolved configs to companies.csv
        run: python -u apply_resolved.py

      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a run that broke an invariant
        # loses its work rather than committing it -- docs/BACKLOG.md 64.
        run: python check_invariants.py
      - name: Commit healed configs
        run: |
          git config user.name  "heal-bot"
          git config user.email "heal@users.noreply.github.com"
          git add companies.csv cloud_state/health_baseline.json cloud_state/resolve_attempts.json || true
          git commit -m "self-heal: re-resolve stale ATS boards $(date -u +%F) [skip ci]" \
            || { echo "nothing to heal this run"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              # CONFLICT on companies.csv: rebase can't merge it, and giving up here
              # discards the whole run (3.5h listing-hunt lost 2026-08-22). Re-apply just
              # THIS run's row changes onto origin's current file and retry.
              git rebase --abort 2>/dev/null || true
              # preserve EVERY artifact this run produced — `git reset --hard` below would
              # otherwise destroy seen.db (re-emailing every role), caches and digests.
              rm -rf /tmp/ours && mkdir -p /tmp/ours
              for p in companies.csv scraped_cache.json discovered_cache.json                        research_companies.json cloud_state digests docs; do
                [ -e "$p" ] && cp -r "$p" /tmp/ours/ 2>/dev/null || true
              done
              git fetch origin ${GITHUB_REF_NAME} || true
              git reset --hard origin/${GITHUB_REF_NAME} || true
              # Copy back ONLY what THIS job owns. `cp -r cloud_state .` restored the whole
              # directory as it was at CHECKOUT TIME, so a run that conflicts hours later
              # silently reverted every cloud_state/seen.db row other workflows had committed
              # in between — sent/matched/llm_cache/firmographics, last-writer-wins on a
              # binary git cannot merge (HANDOFF open item 7). Only the digest owns seen.db.
              for p in cloud_state/health_baseline.json cloud_state/resolve_attempts.json; do
                [ -e "/tmp/ours/$p" ] && { mkdir -p "$(dirname "$p")"; cp -rT "/tmp/ours/$p" "$p"; } 2>/dev/null || true
              done
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours/companies.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours/companies.csv companies.csv || true
                # the merged registry passes the same gate before it is committed
                python check_invariants.py || { echo "::error::merged registry fails invariants"; exit 1; }
              fi
              # scraped_cache.json has eight writers across six workflows, each rewriting the
              # whole dict — restoring ours wholesale deleted every company another workflow
              # had cached since checkout. Merge it per company key, like the csv.
              if [ -f /tmp/base_cache.json ] && [ -f /tmp/ours/scraped_cache.json ]; then
                python merge_json_cache.py /tmp/base_cache.json /tmp/ours/scraped_cache.json                        scraped_cache.json scraped_cache.json || true
              fi
              git add -A . || true
              git commit -m "row-merged state $(date -u +%F) [skip ci]" || true
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1

# (workflow re-index nudge)
