name: Self-heal ATS coverage (re-resolve stale boards)

# Coverage rots silently: a company moves Workday tenant, changes its Greenhouse slug, or
# turns on anti-bot, and its board quietly returns 0 forever. Detection is now FREE + DAILY —
# pipeline.run records a stale list (cloud_state/stale.json) as a byproduct of the digest's
# fetch. This job re-resolves that list DAILY (headless capture, escalating to the Bright Data
# unlocker for anti-bot sites) and commits the corrected companies.csv. Mondays it also does a
# full independent health sweep as a backstop. Whatever it can't fix, discovery backfills. PC off.

on:
  schedule:
    - cron: "0 6 * * *"          # daily 06:00 UTC (after the 05:00 digest commits stale.json)
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated company names to re-resolve (blank = all stale)"
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  self-heal:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Weekly full health sweep (Mondays — backstop to daily inline detection)
        run: |
          # Daily detection already wrote cloud_state/stale.json as a byproduct of the digest.
          # On Mondays, also run the full independent sweep to catch slow drift.
          if [ "$(date -u +%u)" = "1" ]; then python -u health_check.py; \
          else echo "not Monday — re-resolving today's daily-detected stale.json"; fi

      - name: Re-resolve stale boards (Bright Data unlocker for anti-bot sites)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then python -u resolve_broken.py --only "$ONLY";
          else python -u resolve_broken.py; fi

      - name: Apply resolved configs to companies.csv
        run: python -u apply_resolved.py

      - name: Commit healed configs
        run: |
          git config user.name  "heal-bot"
          git config user.email "heal@users.noreply.github.com"
          git add companies.csv cloud_state/health_baseline.json cloud_state/resolve_attempts.json || true
          git commit -m "self-heal: re-resolve stale ATS boards $(date -u +%F) [skip ci]" \
            || { echo "nothing to heal this run"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${GITHUB_REF_NAME} \
              && git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            git rebase --abort 2>/dev/null || true; sleep $((i*20))
          done
          echo "::error::push failed after 5 retries"; exit 1
