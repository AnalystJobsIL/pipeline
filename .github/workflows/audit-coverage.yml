name: Audit coverage (wayback rescue + empty cross-validation)

# Weekly audit that (1) tries to rescue 'unreachable' companies via the Wayback Machine — archived
# HTML often exposes their real ATS board, which we then verify LIVE via the ATS API on its open
# host — and (2) cross-validates 'validated-empty' companies against their raw HTML + embedded ATS
# so a scraper parse-miss can't hide real Israel jobs. Commits any promotions.

on:
  schedule:
    - cron: "0 4 * * 0"        # Sundays ~07:00 Israel
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Wayback-rescue unreachable
        env:
          # docs/BACKLOG.md 59: without the key, page_names_company's unlocker rung is
          # silently inert and every bot-walled page reads as no-evidence
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python wayback_rescue.py
        continue-on-error: true
      - name: Cross-validate the empties
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
        run: python validate_empty.py
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium + Claude CLI (token reads, LLM extraction)
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
          npm install -g @anthropic-ai/claude-code
        continue-on-error: true

      - name: Re-audit parked rows (cheap rung, then the Chromium rung over what stayed dark)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          SERP_RESERVE: "50"
          # the Chromium rung is deep_validate's validator (was Saturday's own cron until
          # 2026-08-26, over the identical row set 24 h earlier -- BACKLOG 6); its caps
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          DEEP_LLM_CAP: "150"
          DEEP_BD_SEARCH_CAP: "150"
          AUDIT_DEEP_BUDGET_MIN: "120"
        run: python audit_empty_rows.py --apply
        continue-on-error: true

      # These two carry 30-day staleness escapes that only fire if something runs them —
      # unscheduled, their escapes are dead code and their rows never recover.
      - name: Liveness re-scan (clears revived domains, flags newly dead)
        run: python scan_dead_domains.py --apply
        continue-on-error: true

      - name: Re-crack walled-ATS rows (30d cadence)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          SCRAPE_LLM: "1"
        run: python crack_walled.py --apply
        continue-on-error: true
      - name: Coverage report
        run: python coverage_report.py
      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit audit results
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          # cloud_state/scan_seen.json: written by the liveness re-scan and never committed
          # until 2026-08-25 (BACKLOG 17)
          python persist_state.py commit --as "audit-bot" \
            -m "coverage audit $(date -u +%F) [skip ci]" \
            --own companies.csv scraped_cache.json cloud_state/scan_seen.json \
                  cloud_state/audit_seen.json

# (workflow re-index nudge)
