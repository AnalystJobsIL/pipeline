name: Deep-validate parked companies (render + sniff + LLM)

# One-off / on-demand loop over every parked '0 openings' company: render the careers page
# in Chromium, sniff network requests for the real ATS API, let Claude judge the evidence
# when regexes fail, verify every proposal live, and persist a per-company verdict into the
# row note (recovered / unsupported ATS / no ATS detected / unreachable). Time-budgeted so
# the commit step always runs; re-dispatch to continue where it stopped.

on:
  schedule:
    # Was dispatch-only, so `_revalidatable`'s staleness escape never fired and this whole
    # resolver only ever ran when someone remembered to press the button. Saturday keeps it
    # clear of Sunday's audit-coverage run (both hold the `repo-state` group for ~5h).
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      limit:
        description: "companies to process (0 = all remaining)"
        default: "0"
      llm_cap:
        description: "max Claude proposals"
        default: "150"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI + Playwright
        run: |
          npm install -g @anthropic-ai/claude-code
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Deep-validate
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          DEEP_LIMIT: ${{ github.event.inputs.limit || '0' }}
          DEEP_LLM_CAP: ${{ github.event.inputs.llm_cap || '150' }}
          DEEP_BD_SEARCH_CAP: "150"
          DEEP_TIME_BUDGET_MIN: "280"
        run: python deep_validate.py --apply
        continue-on-error: true
      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit verdicts
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "audit-bot" \
            -m "deep-validate parked companies $(date -u +%F) [skip ci]" \
            --own companies.csv
