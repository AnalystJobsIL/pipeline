name: Retry unreachable (cloud, until zero)

# Re-attacks companies marked 'unreachable' by trying alternate careers URLs (/careers, /jobs,
# careers.<domain>, ...) with a longer timeout. Promotes any that now resolve. Runs daily so the
# unreachable count keeps grinding down toward zero on its own — PC off.

on:
  schedule:
    - cron: "30 2 * * *"       # daily, ~04:30 Israel
  workflow_dispatch:
    inputs:
      limit:
        description: "max unreachable to retry this run (0 = all)"
        default: "150"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

env:
  # BLAST RADIUS, not a budget (lane: infra, 2026-08-28). The month's ceiling is
  # `pipeline/bd_budget.py`; this stops ONE job's loop running away, which nothing did
  # before -- retry-unreachable could buy 600 credits a night and crack_walled ~2,000,
  # and neither had any limit. Enforced in `bd_rescue.unlock_status`, which every rung
  # here reaches; per PROCESS, so each step gets its own. Unset = unlimited, so this is
  # the only thing that changes for a workflow that does not name it. The `[bd-spend]`
  # line each step now prints is the measurement that should replace this guess.
  BD_RUN_CAP: "250"

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Bright Data unlock pass (if key configured)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BD_LIMIT: "120"
        run: |
          [ -z "$BRIGHTDATA_API_KEY" ] && { echo "no Bright Data key; skipping unlock pass"; exit 0; }
          python bd_rescue.py
        continue-on-error: true

      - name: Retry unreachable with URL rediscovery
        env:
          RETRY_LIMIT: ${{ github.event.inputs.limit || '150' }}
          FAST_SCRAPE: "1"
        run: python retry_unreachable.py
      - name: Registry invariants gate the commit
        # deliberately NOT continue-on-error: a broken registry makes the job red here,
        # and persist_state.py (below, `if: always()`) restores companies.csv from the
        # checkout while every other owned path still lands -- BACKLOG 64, policy of
        # 2026-08-25 (ARCHITECTURE §4).
        run: python check_invariants.py
      - name: Stage stamps on the run page
        if: always()
        run: python -m pipeline.stages >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true
      - name: Commit recoveries
        # One delivery path for every workflow (persist_state.py, lane: infra): stages ONLY
        # the paths this job owns, gates them (JSON parses, sqlite quick_check,
        # check_invariants on the registry -- a failing file is restored, the rest lands,
        # the step is red), and on a push conflict merges each file by its own rule instead
        # of copying a checkout-era copy over origin's newer one. `if: always()`: a failed
        # step or a timeout no longer discards the night's work (BACKLOG 39/128).
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "retry-bot" \
            -m "retry-unreachable $(date -u +%FT%H:%M) [skip ci]" \
            --own companies.csv scraped_cache.json

