name: Retry unreachable (cloud, until zero)

# Re-attacks companies marked 'unreachable' by trying alternate careers URLs (/careers, /jobs,
# careers.<domain>, ...) with a longer timeout. Promotes any that now resolve. Runs daily so the
# unreachable count keeps grinding down toward zero on its own — PC off.

on:
  schedule:
    - cron: "30 2 * * *"       # daily, ~04:30 Israel
  workflow_dispatch:
    inputs:
      limit:
        description: "max unreachable to retry this run (0 = all)"
        default: "150"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
      - name: Snapshot companies.csv baseline (git-layer merge)
        run: cp companies.csv /tmp/base.csv || true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Bright Data unlock pass (if key configured)
        env:
          BRIGHTDATA_API_KEY: ${{ secrets.BRIGHTDATA_API_KEY }}
          BRIGHTDATA_ZONE: ${{ secrets.BRIGHTDATA_ZONE }}
          BD_LIMIT: "120"
        run: |
          [ -z "$BRIGHTDATA_API_KEY" ] && { echo "no Bright Data key; skipping unlock pass"; exit 0; }
          python bd_rescue.py
        continue-on-error: true

      - name: Retry unreachable with URL rediscovery
        env:
          RETRY_LIMIT: ${{ github.event.inputs.limit || '150' }}
          FAST_SCRAPE: "1"
        run: python retry_unreachable.py
      - name: Commit recoveries
        run: |
          git config user.name  "retry-bot"
          git config user.email "retry@users.noreply.github.com"
          git add companies.csv scraped_cache.json
          git commit -m "retry-unreachable $(date -u +%FT%H:%M) [skip ci]" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin ${GITHUB_REF_NAME}; then
              git push origin HEAD:${GITHUB_REF_NAME} && exit 0
            else
              # CONFLICT on companies.csv: rebase can't merge it, and giving up here
              # discards the whole run (3.5h listing-hunt lost 2026-08-22). Re-apply just
              # THIS run's row changes onto origin's current file and retry.
              git rebase --abort 2>/dev/null || true
              # preserve EVERY artifact this run produced — `git reset --hard` below would
              # otherwise destroy seen.db (re-emailing every role), caches and digests.
              rm -rf /tmp/ours && mkdir -p /tmp/ours
              for p in companies.csv scraped_cache.json discovered_cache.json                        research_companies.json cloud_state digests docs; do
                [ -e "$p" ] && cp -r "$p" /tmp/ours/ 2>/dev/null || true
              done
              git fetch origin ${GITHUB_REF_NAME} || true
              git reset --hard origin/${GITHUB_REF_NAME} || true
              for p in scraped_cache.json discovered_cache.json research_companies.json                        cloud_state digests docs; do
                [ -e "/tmp/ours/$(basename $p)" ] && cp -r "/tmp/ours/$(basename $p)" . 2>/dev/null || true
              done
              if [ -f /tmp/base.csv ] && [ -f /tmp/ours/companies.csv ]; then
                python merge_csv_rows.py /tmp/base.csv /tmp/ours/companies.csv companies.csv || true
              fi
              git add -A . || true
              git commit -m "row-merged state $(date -u +%F) [skip ci]" || true
            fi
            sleep $((i*15))
          done
          echo "::error::push failed after 5 retries"; exit 1

# (workflow re-index nudge)
