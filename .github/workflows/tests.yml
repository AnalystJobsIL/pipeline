name: Unit guards

# The only thing standing between an AI-authored edit and the nightly crons. Pure functions
# only — no network, no --apply, no state writes — so it cannot flake. Every assertion
# corresponds to a bug that actually shipped; see tests/test_units.py.
#
# This workflow does NOT use continue-on-error anywhere. It is meant to block.
#
# THREE JOBS, AND EVERY LONG STEP CARRIES ITS OWN NAMED BUDGET (lane: infra, 2026-08-30,
# BACKLOG 442/435). Until today `guard` ran the suite AND six 14-night registry rehearsals
# under one `timeout-minutes: 10`; the rehearsals outgrew it (steps 1-8 = 3m35s, the five
# seeded rehearsals cut off at 6m38s on run 33294986316) and the job was CANCELLED on every
# push from 04:55Z -- eleven runs, no verdict, while `Unit guards` itself passed inside each.
# A cancelled job names nothing: six lanes spent a morning reading master's colour from a
# signal that carries no information. Raising the number was rejected for the same reason
# BACKLOG 195 rejected it for the mutation gate ("buys a week, fixes nothing").
#
# So: `guard` is the suite alone; `rehearse` is one job per rehearsal (a matrix, so a red
# or a cancel NAMES the policy and seed); `mutation-gate` is unchanged. And each long step
# runs under GNU `timeout` with a budget BELOW its job's `timeout-minutes`, so an overrun is
# a FAILED STEP that says what it was running ("rehearsal (mixed, seed 3) exceeded its
# 12-minute budget") instead of a cancelled job that says nothing. `--signal=INT` so pytest
# gets a chance to print its summary; `--kill-after` so a hung interpreter cannot outlive
# the budget -- and when THAT fires, `timeout` itself dies with the group and the shell sees
# 137, not 124 (wave 1 measured it), so both codes are read as the budget.
# `test_every_long_tests_step_has_a_named_budget_below_its_job_timeout` pins the shape.

on:
  push:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        # depth 1, on purpose: `test_ci_itself_confirms_why_the_tree_check_cannot_run_there`
        # asserts the runner is never "behind origin/master", which a full-history checkout
        # of a non-master ref would be (wave 1, 2026-08-30). BACKLOG 439's `fetch-depth: 0`
        # + `github.event.before` land TOGETHER with the docs/check_docs.py change that
        # reads them, or not at all -- history nothing consumes is a red guard waiting.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Compile everything (catches the syntax-error class instantly)
        run: python -m compileall -q . -x '(\.venv|out|state)'
      - name: Unit guards
        run: |
          rc=0
          timeout --signal=INT --kill-after=30 7m python -m pytest || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::Unit guards: pytest exceeded its 7-minute budget (job timeout 10; rc $rc, 137 = killed after the INT grace) -- the suite grew; shard or trim it, do not raise the number"
          fi
          exit "$rc"
      - name: Registry invariants
        run: python check_invariants.py
      - name: Platform wiring report (informational)
        run: python -m pipeline.platform_check || true

  # Every test the push ADDED must fail with the push's non-test files put back to the
  # previous tip (`tools/guard_kill.py`, infra 2026-08-30). A guard that cannot fail is the
  # defect this repo is built around, and on 2026-08-30 the day's 184 new tests measured
  # 11 that pass with their fix reverted. Its own job because it needs history (`guard` is
  # depth 1 on purpose, see above) and its base is the push's `before` sha -- unknown after
  # a force-push or on a new branch (all zeros), where `HEAD~1` is the honest fallback.
  guard-kill:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Every new guard dies without its fix
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then base="HEAD~1"; fi
          echo "base: $base ($(git rev-parse --short "$base"))"
          rc=0
          timeout --signal=INT --kill-after=30 10m python tools/guard_kill.py --base "$base" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::guard-kill: exceeded its 10-minute budget (job timeout 12; rc $rc, 137 = killed after the INT grace) -- the new-test set is too large for one job; shard it, do not raise the number"
          fi
          exit "$rc"

  # Every scheduled registry tool's real main() over a copy of the registry with the network
  # forbidden, fourteen nights; exit 1 on the first pool that loses a row it should keep
  # (registry lane, BACKLOG 52). `worst` once and `mixed` under five seeds (the truncation
  # seed 1 found on 2026-08-26). The rehearsals are independent by construction -- one seed
  # per process (`tests/rehearse_registry.py --seed`) -- so each is its own job: a unit
  # failure is never hidden behind a rehearsal, and a failing or cancelled rehearsal names
  # its policy and seed in the job title. `fail-fast: false` for the same reason as the
  # mutation gate: one seed's finding must not hide another's.
  rehearse:
    name: rehearse (${{ matrix.policy }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { policy: worst, seed: 1 }
          - { policy: mixed, seed: 1 }
          - { policy: mixed, seed: 2 }
          - { policy: mixed, seed: 3 }
          - { policy: mixed, seed: 4 }
          - { policy: mixed, seed: 5 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fourteen rehearsed nights keep every re-check pool
        env:
          POLICY: ${{ matrix.policy }}
          SEED: ${{ matrix.seed }}
        run: |
          rc=0
          timeout --signal=INT --kill-after=30 12m python tests/rehearse_registry.py --nights 14 --policy "$POLICY" --seed "$SEED" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::rehearsal (policy $POLICY, seed $SEED) exceeded its 12-minute budget (job timeout 15; rc $rc, 137 = killed after the INT grace) -- a night got slower; measure which tool, do not raise the number"
          fi
          exit "$rc"

  # The suite alone proved insufficient FIVE times this rebuild: a one-token edit on an
  # activating path stayed green until tools/mutate.py said otherwise, and the catalogue
  # only ran when an operator remembered to run it (wave-4 R3 named this gap). The
  # catalogue is tests/mutations.json (the run prints what it ran) -- each record a
  # recorded defeat or a near-miss -- plus the derived per-call-site coverage check, which
  # fails the build the commit a new activating writer appears without its mutations.
  #
  # SHARDED 2026-08-28 (lane: infra, BACKLOG 195). The catalogue went from 105 records at
  # the last green run (60fae33, 2026-08-24, whole workflow ~35 min) to 204 -- 1.94x -- and
  # `timeout-minutes: 45` did not move, so the job was CANCELLED on 40 consecutive pushes
  # and this repo has had no mutation protection since 2026-08-24. A cancelled gate is
  # worse than a slow one: a gate that fails names the surviving mutant, a gate that times
  # out names nothing. 195 rejected simply raising the timeout ("buys a week, fixes
  # nothing") and named sharding, which is what this is.
  #
  # The split is computed FROM THE CATALOGUE at run time by least-loaded bin-packing over
  # the `M<n>` class prefixes `--class` selects on, so a class the registry lane adds
  # tomorrow lands in a shard by itself -- there is no list here to fall out of date, which
  # is the silent-exclusion shape this repo keeps paying for. 2026-08-30: 86 / 71 / 69
  # records, walls 25 / 22 / 21 min; the cost driver is full-suite fallbacks, not records.
  # `test_the_mutation_shards_partition_the_whole_catalogue` runs this exact script over
  # the real catalogue and fails if the shards ever stop covering it exactly once.
  # `fail-fast: false`: one shard's surviving mutant must not hide another's.
  mutation-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install pytest
        run: python -m pip install --quiet pytest
      - name: Every mutation dies and every writer is covered
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: "3"
        run: |
          CLS="$(python - <<'PY'
          import collections, json, os
          n, i = int(os.environ["SHARDS"]), int(os.environ["SHARD"])
          muts = json.load(open("tests/mutations.json", encoding="utf-8"))
          size = collections.Counter(m["class"].split("-")[0] for m in muts)
          bins, load = [[] for _ in range(n)], [0] * n
          for cls, k in sorted(size.items(), key=lambda x: (-x[1], x[0])):   # deterministic
              j = load.index(min(load))
              bins[j].append(cls)
              load[j] += k
          print(",".join(sorted(bins[i])))
          PY
          )"
          if [ -z "$CLS" ]; then
            echo "::error::shard $SHARD drew no classes -- there are fewer classes than shards,"
            echo "::error::so some mutations would run in NO shard. Lower SHARDS in this file."
            exit 1
          fi
          echo "shard $SHARD of $SHARDS -> classes $CLS"
          rc=0
          timeout --signal=INT --kill-after=60 40m python tools/mutate.py --class "$CLS" || rc=$?
          if [ "$rc" -eq 124 ] || [ "$rc" -eq 137 ]; then
            echo "::error::mutation shard $SHARD (classes $CLS) exceeded its 40-minute budget (job timeout 45; rc $rc, 137 = killed after the INT grace) -- the per-record lines above say how far it got; add a shard (SHARDS) rather than minutes"
          fi
          exit "$rc"
