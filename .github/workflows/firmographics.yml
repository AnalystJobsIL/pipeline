name: Company intel — registry backlog (cloud)

# Researches the company facts (sector / stage / employees / founded / Israel centre) for
# registry rows that have none, so the daily digest does not have to. Lane: company-intel.
#
# WHY THIS EXISTS (2026-08-26). The bulk research ran on the OWNER'S LAPTOP: a Windows
# scheduled task, `IsraeliJobs-Firmographics`, every 6 h. Two things were wrong with that:
#
#   1. It never reached the cloud. The task writes cloud_state/firmographics.json into the
#      SHARED CHECKOUT as an unstaged tracked file and never commits it, so the next lane's
#      `git pull --rebase` stashes it away. On 2026-08-26 the chain logged `exported 968
#      records` at 21:00:05, the file's mtime was 21:00:42, git reflog showed a
#      `pull --rebase` at 21:00:42 to the second, and 22 researched companies were sitting
#      in stash@{0}. `firmo_health_check` reported OK throughout. (Recovered in f71d4ac.)
#   2. Production depended on a laptop being awake.
#
# The digest's own hook stays: it is the SAME-DAY fast path, so a company that appears on
# today's board gets facts on today's card. It is capped small on purpose — it sits on the
# mail's critical path, and the measured slack there is ~13 minutes (2026-08-26: the digest
# ran 05:38:55 -> 06:04:13 and the inbox relay polls at 06:17). This job carries the bulk,
# where nothing is waiting on it.
#
# Research is ONE-TIME per company: records refresh at --refresh-days 180, and the oldest
# record today is 2026-08-21, so nothing re-researches before 2027-02.
#
# THE CAP IS 150, NOT 40, AND THE ARITHMETIC IS WHY (measured 2026-08-28).
#
# "Steady state is the 3-16 rows/day the registry grows by" was true when this file was
# written on 2026-08-26 and is not true now. Re-derived from `git log` on companies.csv:
# 862 active rows on 08-24 -> 1,002 on 08-28 20:23 = +28.9/day over 4.85 days, +68.6/day
# over the last 48 h, and +65 on 08-28 alone.
#
# Throughput per run, from the only two real runs there have ever been: the 08-27 cron did
# 23 calls in 334 s of model time (173 s wall at 2 workers), and a 135-call drain the same
# night took 2,844 s of model time (~24 min wall). Take the slower of the two: ~10.5 s of
# WALL per call at --workers 2.
#
#     --limit  40  ->   7.0 min of a 120-minute job   (5.8 %)
#     --limit 150  ->  26.2 min                       (21.9 %)
#
# Slot reliability, measured: TWO scheduled opportunities, TWO delivered -- but at
# +605 min (2026-08-27T20:05Z) and +662 min (2026-08-28T21:02Z), i.e. eleven hours after
# the slot, AFTER the evening registry work rather than before the morning digest.
#
# And the cap is not theoretical: run 33210826528 on 2026-08-28 saw `139 to do`, spent
# exactly 40 calls (38 researched, 2 failed, 582 s model, 5 min wall) and LEFT 99 BEHIND.
# At its own rate -- 7.3 s of wall per call at 2 workers -- clearing all 139 would have
# cost 18 minutes of a 120-minute job.
#
#     40 x 100 % =  40/day  -- keeps pace with the 4.85-day mean, SHORT of the recent
#                              rate by 28.6/day, and measurably short of one real night
#    150 x 100 % = 150/day  -- clears any night the registry has actually produced
#
# The cap was never protecting the clock (40 calls used 6 % of the job); it was protecting
# nothing and losing ground. It is a CEILING, not a target: on a quiet day the run still
# stops when `todo` empties, and the standing backlog after the 08-28 drain was 6.

on:
  schedule:
    - cron: "17 10 * * *"      # daily 10:17 UTC ~ 13:17 Israel. Deliberately clear of every
                               # other cron on the shared `repo-state` group: 00:00
                               # scrape-refresh, 02:30 retry-unreachable, 04:00 Sun audit,
                               # 05:00 digest, 06:00 self-heal, 08:00+20:00 auto-expand,
                               # 18:00 triage, and 19:00 listing-hunt whose 200-minute
                               # budget can run to 22:20. Daylight, so a bad run is seen.
                               # :17, not :00 (infra 2026-08-30, BACKLOG 450b/305): every
                               # run this cron ever had arrived +293..+662 min late, and the
                               # measured failure is LATENESS, not absence -- a second slot
                               # would carry the same lag, so none was added. Every cron in
                               # this repo sat on :00/:30, the minute GitHub names as its
                               # congested one; this is the one cron moved off it, and the
                               # 09-06 morning check reads its lag to decide the rest.
  workflow_dispatch:
    inputs:
      limit:
        description: "max companies to research this run (0 = unbounded)"
        default: "150"
      refresh_days:
        description: "re-research records older than this many days"
        default: "180"

permissions:
  contents: write

concurrency:
  group: repo-state
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          # the pinned CLI wants node >= 22 (`npm warn EBADENGINE` on every run at 20.x);
          # an unpinned runtime under a pinned CLI is drift with a name (BACKLOG 450d)
          node-version: "22"
      - name: Install the Claude CLI
        # pinned, exactly as daily-digest.yml pins it: the seam's flags (--tools,
        # --allowedTools, --json-schema, --effort) are version-surface, and a silent CLI
        # upgrade is a drift failure the breaker would report as `unknown option`.
        run: npm install -g @anthropic-ai/claude-code@2.1.241

      - name: Research the registry backlog
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # --workers 2, not 3: BACKLOG 97 records `529 Overloaded` on 2 of 3 calls at 3.
          FIRMO_RESEARCH_MODEL: sonnet
          FIRMO_RESEARCH_EFFORT: low
        run: |
          python research_firmographics.py \
            --workers 2 \
            --budget-min 60 \
            --limit "${{ github.event.inputs.limit || '150' }}" \
            --refresh-days "${{ github.event.inputs.refresh_days || '180' }}"
          python research_firmographics.py --export

      - name: Stamp the stage when the research step died from outside (BACKLOG 450c)
        # the script stamps `crashed(<Type>)` from inside Python; a step killed by the job
        # timeout or an OOM stamps nothing and leaves yesterday's stamp, which the digest
        # then reads as a drained night. Only `failure()` -- a healthy night keeps its counts.
        if: failure()
        run: python -m pipeline.stages stamp firmo alarm=step-failed

      - name: What the run produced
        # A green workflow proves nothing here (CLAUDE.md rule 1): say what it PRODUCED.
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv, json, sys
          sys.path.insert(0, ".")
          from pipeline.firmographics import display_index, identity_key
          d = json.load(open("cloud_state/firmographics.json", encoding="utf-8"))
          idx = display_index(d)
          act = [r["company_name"] for r in csv.DictReader(open("companies.csv", encoding="utf-8-sig"))
                 if r["active"].strip().lower() == "true"]
          miss = [n for n in act if not (d.get(n) or idx.get(identity_key(n)))]
          print(f"- export **{len(d)}** records")
          print(f"- active registry rows **{len(act)}**, of which **{len(miss)}** still have no facts")
          if miss:
              print(f"- backlog: {', '.join(sorted(miss)[:25])}")
          PY
        continue-on-error: true

      - name: Company death watch (read-only proposals)
        # BACKLOG 244. The researcher keeps discovering that a listed company shut down or
        # was absorbed, and that knowledge used to die in a stage_note while the row stayed
        # active and its board was fetched every morning. READ-ONLY and no --apply: parking
        # a row is `registry`'s write, and an acquired company usually still hires (Wiz is
        # acquired-by-bigtech and hiring), so a plausible automatic verdict that removes a
        # live employer is ARCHITECTURE section 8's first failure class.
        if: always()
        run: python firmo_death_watch.py --summary >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Requirement mix by company type
        # `company_type_analysis.py` was hand-run only, so it silently rotted when the record
        # shape changed underneath it. Running it here means it is exercised every day
        # against the real export, in the cloud, like everything else.
        if: always()
        run: |
          python company_type_analysis.py --firmo cloud_state/firmographics.json \
            --db cloud_state/seen.db
          # it PRINTS a plain-text join report and WRITES the markdown; the summary
          # wants the markdown, capped so one sector table cannot bury the page
          echo "### Requirement mix by company type" >> "$GITHUB_STEP_SUMMARY"
          head -40 out/company_type_analysis.md >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Commit the export
        # The export, the strike ledger, and the stage stamp that is the ONLY
        # measurement of whether this cron ran at all. NOT cloud_state/seen.db, which is
        # `SINGLE_WRITER: daily-digest` in persist_state.STRATEGY -- a second writer would
        # replace the runner's matched / roles / llm_cache tables wholesale. The digest's
        # own `sync_store` seeds sqlite from this export next morning, idempotently, which
        # is exactly what that seam is for.
        if: always()
        timeout-minutes: 10
        run: |
          python persist_state.py commit --as "firmo-bot" \
            -m "company intel: registry backlog $(date -u +%F) [skip ci]" \
            --own cloud_state/firmographics.json cloud_state/firmo_failed.json \
                  cloud_state/pipeline_stages.json
